function saveConsulta(e){
  e.preventDefault();
  const f = e.target;
  const data = f.data.value;
  const peso = parseFloat(f.peso.value)||0;
  const retorno = f.retorno.value;
  const veterinarioId = f.veterinarioId.value ? Number(f.veterinarioId.value) : null;
  const motivo = f.motivo.value.trim();
  const exameFisico = f.exameFisico.value.trim();
  const diagnostico = f.diagnostico.value.trim();
  const tratamento = f.tratamento.value.trim();
  const proximosPassos = f.proximosPassos.value.trim();
  const observacoes = f.observacoes.value.trim();
  if(!data || !consultaPetId) return;
  if(editingConsultaId){
    const c = state.consultas.find(function(x){ return x.id===editingConsultaId; });
    Object.assign(c,{data:data,peso:peso,retorno:retorno,veterinarioId:veterinarioId,motivo:motivo,exameFisico:exameFisico,diagnostico:diagnostico,tratamento:tratamento,proximosPassos:proximosPassos,observacoes:observacoes});
  } else {
    state.consultas.push({
      id: ids.consulta++, petId: consultaPetId, data:data, peso:peso, retorno:retorno, veterinarioId:veterinarioId,
      motivo:motivo, exameFisico:exameFisico, diagnostico:diagnostico, tratamento:tratamento,
      proximosPassos:proximosPassos, observacoes:observacoes, criadoEm: new Date().toISOString()
    });
  }
  /* Atualiza o peso cadastrado do pet com o valor informado nesta consulta.
     É uma gravação única, feita apenas neste instante de salvar — não é um vínculo
     automático (data binding): o registro da consulta guarda seu próprio peso histórico
     de forma independente, e o cadastro do pet só muda de novo por uma ação manual
     (editar o pet, ou registrar outra consulta/vacina com peso). */
  if(peso > 0){
    const pet = state.pets.find(function(p){ return p.id===consultaPetId; });
    if(pet) pet.peso = peso;
  }
  markDirty();
  const wasEditing = !!editingConsultaId;
  editingConsultaId = null;
  consultaStep = 'selecionar';
  consultaPetId = null;
  render();
  toast(wasEditing ? 'Consulta atualizada.' : 'Consulta registrada no prontuário.');
}
function cancelEditConsulta(){
  editingConsultaId = null;
  consultaStep = 'selecionar';
  consultaPetId = null;
  render();
}

    const v = state.vacinas.find(function(x){ return x.id===editingVacinaId; });
    Object.assign(v,{tipo:tipo,dataAplicacao:dataAplicacao,dataValidade:dataValidade,fabricante:fabricante,lote:lote,veterinarioId:veterinarioId,observacoes:observacoes});
  } else {
    state.vacinas.push({
      id: ids.vacina++, petId: vacinaPetId, tipo:tipo, dataAplicacao:dataAplicacao, dataValidade:dataValidade,
      fabricante:fabricante, lote:lote, veterinarioId:veterinarioId, observacoes:observacoes, criadoEm: new Date().toISOString()
    });
  }
  markDirty();
  const wasEditing = !!editingVacinaId;
  editingVacinaId = null;
  vacinaStep = 'selecionar';
  vacinaPetId = null;
  render();
  toast(wasEditing ? 'Vacina atualizada.' : 'Vacina registrada no prontuário.');
}
function cancelEditVacina(){
  editingVacinaId = null;

  vacinaPetId = null;

}

function trocarAnimalReceita(){

function saveReceita(e){
  e.preventDefault();
  const f = e.target;
  const data = f.data.value;
  const veterinarioId = f.veterinarioId.value ? Number(f.veterinarioId.value) : null;
  const prescricao = f.prescricao.value.trim();
  if(!data || !prescricao || !receitaPetId) return;
  if(editingReceitaId){
    const r = state.receitas.find(function(x){ return x.id===editingReceitaId; });
    Object.assign(r,{data:data,veterinarioId:veterinarioId,prescricao:prescricao});
  } else {
    state.receitas.push({
      id: ids.receita++, petId: receitaPetId, data:data, veterinarioId:veterinarioId,
      prescricao:prescricao, criadoEm: new Date().toISOString()
    });
  }
  markDirty();
  const wasEditing = !!editingReceitaId;
  editingReceitaId = null;
  receitaStep = 'selecionar';
  receitaPetId = null;
  receitaPrefill = null;
  render();
  toast(wasEditing ? 'Receita atualizada.' : 'Receita registrada no prontuário.');
}
function cancelEditReceita(){
  editingReceitaId = null;
  receitaStep = 'selecionar';
  receitaPetId = null;
  receitaPrefill = null;
  render();
}

function renderProntuarioDetalhe(){
  const pet = state.pets.find(function(p){ return p.id===prontuarioPetId; });
  if(!pet){ prontuarioPetId=null; return renderProntuarioPicker(); }
  const tutor = state.tutors.find(function(t){ return t.id===pet.tutorId; });
  const consultas = state.consultas.filter(function(c){ return c.petId===pet.id; });
  const vacinas = state.vacinas.filter(function(v){ return v.petId===pet.id; });
  const receitas = state.receitas.filter(function(r){ return r.petId===pet.id; });

  const eventos = [];
  consultas.forEach(function(c){ eventos.push({data:c.data, criadoEm:c.criadoEm, html:renderConsultaCard(c)}); });
  vacinas.forEach(function(v){ eventos.push({data:v.dataAplicacao, criadoEm:v.criadoEm, html:renderVacinaCard(v)}); });
  receitas.forEach(function(r){ eventos.push({data:r.data, criadoEm:r.criadoEm, html:renderReceitaCard(r)}); });
  eventos.sort(function(a,b){ return (b.data+'T'+(b.criadoEm||'')).localeCompare(a.data+'T'+(a.criadoEm||'')); });

  const timeline = eventos.length ? eventos.map(function(ev){ return ev.html; }).join('') : '<div class="card"><div class="empty">'+ICONS.emptyPaw+'<p>Nenhuma consulta, vacina ou receita registrada para esse pet ainda.</p></div></div>';

  return ''+
  '<div class="page-head">'+
    '<div><span class="eyebrow">Histórico clínico</span><h1 style="display:flex; align-items:center; gap:10px;">'+petAvatar(pet,45)+'<span>Prontuário de '+esc(pet.nome)+'</span></h1>'+
    '<div class="sub">'+esc(pet.especie||'—')+' • Responsável: '+esc(tutor?tutor.nome:'—')+' • '+eventos.length+' registro(s) no prontuário</div></div>'+
    '<div class="btn-row">'+
      '<button class="btn btn-ghost btn-sm" onclick="trocarPetProntuario()">Trocar paciente</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="baixarProntuarioPDF()">'+ICONS.downloadSm+' Baixar prontuário</button>'+
      '<button class="btn btn-ghost" onclick="iniciarVacinaDoProntuario('+pet.id+')">'+ICONS.syringe+' Nova vacina</button>'+
      '<button class="btn btn-ghost" onclick="iniciarReceitaDoProntuario('+pet.id+')">'+ICONS.receita+' Nova receita</button>'+
      '<button class="btn btn-accent" onclick="iniciarConsultaDoProntuario('+pet.id+')">'+ICONS.plus+' Nova consulta</button>'+
    '</div>'+
  '</div>'+
  '<div class="card" style="margin-bottom:18px;">'+
    '<div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:10px;">Dados do responsável</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>Responsável</label><div style="padding:9px 0 0 0; font-weight:600; font-size:15px;">'+esc(tutor?tutor.nome:'—')+'</div></div>'+
      '<div class="field"><label>CPF</label><div style="padding:9px 0 0 0; font-size:15px;">'+esc(tutor&&tutor.cpf?tutor.cpf:'—')+'</div></div>'+
      '<div class="field"><label>Telefone</label><div style="padding:9px 0 0 0; font-size:15px;">'+esc(tutor&&tutor.telefone?tutor.telefone:'—')+'</div></div>'+
      '<div class="field"><label>Email</label><div style="padding:9px 0 0 0; font-size:15px;">'+esc(tutor&&tutor.email?tutor.email:'—')+'</div></div>'+
      '<div class="field"><label>Endereço</label><div style="padding:9px 0 0 0; font-size:15px;">'+esc(formatEndereco(tutor)||'—')+'</div></div>'+
    '</div>'+
  '</div>'+
  timeline;
}

/* ---------- Baixar prontuário em PDF ----------
   Observações são anotações particulares (nunca compartilhadas com o responsável), então
   ficam de fora deste PDF de propósito — ele é o documento que pode circular fora
   do consultório veterinário. */
function slugify(str){
  return String(str||'pet')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'')
    .toLowerCase() || 'pet';
}

function baixarReceitaPDF(id){
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast('Não foi possível gerar o PDF neste navegador.');
    return;
  }
  const r = state.receitas.find(function(x){ return x.id===id; });
  if(!r) return;
  const pet = state.pets.find(function(p){ return p.id===r.petId; });
  if(!pet) return;
  const tutor = state.tutors.find(function(t){ return t.id===pet.tutorId; });
  const vet = r.veterinarioId ? state.veterinarios.find(function(v){ return v.id===r.veterinarioId; })
    : (veterinarioAtivoId ? state.veterinarios.find(function(v){ return v.id===veterinarioAtivoId; }) : null);

  const jsPDF = window.jspdf.jsPDF;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 42;
  const bottomLimit = pageH - 42;
  let y = 46;

  function ensureSpace(h){
    if(y + h > bottomLimit){ doc.addPage(); y = 46; }
  }
  function writeTitle(text){
    ensureSpace(20);
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(31,75,67);
    doc.text(text, marginX, y);
    y += 18;
  }
  function writeSubtitle(text){
    ensureSpace(15);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(178,127,39);
    doc.text(text.toUpperCase(), marginX, y);
    y += 13;
  }
  function writeLine(text, opts){
    opts = opts || {};
    doc.setFont('helvetica', opts.bold?'bold':'normal');
    doc.setFontSize(opts.size||9.5);
    doc.setTextColor(34,48,43);
    const maxW = pageW - marginX*2;
    const lines = doc.splitTextToSize(String(text), maxW);
    lines.forEach(function(line){ ensureSpace(12); doc.text(line, marginX, y); y += 12; });
  }
  function writeField(label, value){
    if(!value) return;
    ensureSpace(11);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(101,114,103);
    doc.text(String(label).toUpperCase(), marginX, y);
    y += 10;
    writeLine(value);
    y += 3;
  }
  /* Coloca pares de campos lado a lado (2 colunas), usado nas seções de identificação
     (Veterinário Responsável, Dados do paciente, Dados do responsável) para ganhar espaço. */
  function writeFieldGrid(pairs){
    const visible = pairs.filter(function(p){ return p[1]; });
    if(!visible.length) return;
    const gutter = 18;
    const colW = (pageW - marginX*2 - gutter) / 2;
    const labelSize = 7.5, valueSize = 9.5, lineH = 11, labelGap = 10, rowGap = 5;
    for(let i=0; i<visible.length; i+=2){
      const left = visible[i], right = visible[i+1];
      doc.setFontSize(valueSize);
      const leftLines = doc.splitTextToSize(String(left[1]), colW);
      const rightLines = right ? doc.splitTextToSize(String(right[1]), colW) : [];
      const rowH = labelGap + Math.max(leftLines.length, rightLines.length||1)*lineH + rowGap;
      ensureSpace(rowH);
      const rowY = y;
      doc.setFont('helvetica','bold'); doc.setFontSize(labelSize); doc.setTextColor(101,114,103);
      doc.text(String(left[0]).toUpperCase(), marginX, rowY);
      doc.setFont('helvetica','normal'); doc.setFontSize(valueSize); doc.setTextColor(34,48,43);
      leftLines.forEach(function(line, li){ doc.text(line, marginX, rowY+labelGap+li*lineH); });
      if(right){
        doc.setFont('helvetica','bold'); doc.setFontSize(labelSize); doc.setTextColor(101,114,103);
        doc.text(String(right[0]).toUpperCase(), marginX+colW+gutter, rowY);
        doc.setFont('helvetica','normal'); doc.setFontSize(valueSize); doc.setTextColor(34,48,43);
        rightLines.forEach(function(line, li){ doc.text(line, marginX+colW+gutter, rowY+labelGap+li*lineH); });
      }
      y = rowY + rowH;
    }
  }
  function divider(){
    ensureSpace(8);
    doc.setDrawColor(227,220,199);
    doc.line(marginX, y, pageW-marginX, y);
    y += 11;
  }

  writeTitle('Oca Pet — Receita Veterinária');
  writeLine(localEData(r.data) || ('Documento gerado em '+formatFullDate(todayISO())+'.'), {size:9});
  y += 2;
  divider();

  if(vet){
    writeSubtitle('Veterinário responsável');
    writeFieldGrid([['Nome', vet.nome], ['CRMV', crmvFormatado(vet)], ['Email', vet.email], ['Registro MAPA', vet.mapa]]);
    y += 1;
    divider();
  }

  writeSubtitle('Paciente');
  writeFieldGrid([
    ['Nome do animal', pet.nome], ['Espécie / raça', pet.especie],
    ['Peso', pet.peso ? (pet.peso+' kg') : ''], ['Idade', pet.idade],
    ['Sexo', pet.sexo]
  ]);
  y += 1;
  divider();

  writeSubtitle('Responsável');
  writeFieldGrid([
    ['Nome', tutor?tutor.nome:''], ['CPF', tutor?tutor.cpf:''],
    ['Telefone', tutor?tutor.telefone:''], ['Email', tutor?tutor.email:''],
    ['Endereço', formatEndereco(tutor)]
  ]);
  y += 1;
  divider();

  writeSubtitle('Prescrição');
  writeLine(r.prescricao, {size:10.5});
  y += 16;
  ensureSpace(26);
  divider();
  writeLine('Assinatura e carimbo do médico veterinário', {size:8.5});

  doc.save('receita-'+slugify(pet.nome)+'-'+r.data+'.pdf');
  toast('Receita baixada em PDF.');
}

function veterinarioNome(id){
  const v = state.veterinarios.find(function(x){ return x.id===id; });
  return v ? v.nome : '';

function crmvFormatado(v){
  if(!v) return '';
  if(v.crmvUf && v.crmvNumero) return 'CRMV/'+v.crmvUf+': '+v.crmvNumero;
  return v.crmvLegado || '';
}
function veterinarioLabel(id){
  const v = state.veterinarios.find(function(x){ return x.id===id; });
  if(!v) return '';
  const crmv = crmvFormatado(v);
  return v.nome+(crmv?(' — '+crmv):'');
}

function openVeterinarioForm(id){
  editingVeterinarioId = id || null;
  veterinarioFormVisible = true;
  render();
}
function closeVeterinarioForm(){ veterinarioFormVisible=false; editingVeterinarioId=null; render(); }
function saveVeterinario(e){
  e.preventDefault();
  const f = e.target;
  const nome = f.nome.value.trim();
  const crmvUf = f.crmvUf.value;
  const crmvNumero = f.crmvNumero.value.trim();
  const email = f.email.value.trim();
  const mapa = f.mapa.value.trim();
  const mensageriaAtiva = f.mensageriaAtiva.checked;
  if(!nome || !crmvUf || !crmvNumero) return;
  if(editingVeterinarioId){
    const v = state.veterinarios.find(x=>x.id===editingVeterinarioId);
    Object.assign(v,{nome:nome,crmvUf:crmvUf,crmvNumero:crmvNumero,email:email,mapa:mapa,mensageriaAtiva:mensageriaAtiva});
  } else {
    state.veterinarios.push({id:ids.veterinario++, nome:nome, crmvUf:crmvUf, crmvNumero:crmvNumero, email:email, mapa:mapa, mensageriaAtiva:mensageriaAtiva});
  }
  markDirty();
  closeVeterinarioForm();
  toast('Veterinário salvo.');
}
function deleteVeterinario(id){
  const usadoEmConsulta = state.consultas.some(function(c){ return c.veterinarioId===id; });
  const usadoEmVacina = state.vacinas.some(function(v){ return v.veterinarioId===id; });
  const msg = (usadoEmConsulta||usadoEmVacina)
    ? 'Esse veterinário está vinculado a consultas ou vacinas já registradas. Excluir mesmo assim? Os registros existentes mantêm o histórico, só deixam de referenciar um veterinário cadastrado.'
    : 'Excluir esse veterinário?';
  if(!confirm(msg)) return;
  state.veterinarios = state.veterinarios.filter(function(v){ return v.id!==id; });
  if(veterinarioAtivoId===id) veterinarioAtivoId = null;
  markDirty();
  render();
  toast('Veterinário excluído.');
}
function setVeterinarioAtivo(id){
  veterinarioAtivoId = id;
  markDirty();
  render();
  toast('Veterinário definido como responsável ativo.');
}
function limparVeterinarioAtivo(){
  veterinarioAtivoId = null;
  markDirty();
  render();
  toast('Nenhum veterinário está marcado como ativo agora.');
}

function saveEstabelecimento(e){

  closeEstabForm();
  toast('Endereço do estabelecimento salvo.');
}

function buildWorkbook(){
  const wsServ = XLSX.utils.json_to_sheet(state.services.map(function(s){
    return {ID:s.id, Nome:s.nome, Categoria:s.categoria, Status:s.status||'Ativo', 'Valor (R$)':s.valor, 'Custo (R$)':s.custo};
  }));
  const wsTut = XLSX.utils.json_to_sheet(state.tutors.map(function(t){
    return {
      ID:t.id, Nome:t.nome, Telefone:t.telefone, CPF:t.cpf, Email:t.email||'',
      Endereco_Rua:t.enderecoRua||'', Endereco_Numero:t.enderecoNumero||'', Endereco_Bairro:t.enderecoBairro||'',
      Endereco_Cidade:t.enderecoCidade||'', Endereco_UF:t.enderecoUf||'', Endereco_CEP:t.enderecoCep||'',
      Endereco:formatEndereco(t)
    };
  }));
  const wsPets = XLSX.utils.json_to_sheet(state.pets.map(function(p){
    const t = state.tutors.find(function(x){return x.id===p.tutorId;}) || {};
    return {
      ID:p.id, TutorID:p.tutorId, Tutor:t.nome||'', Nome:p.nome, 'Especie_Raca':p.especie,
      'Peso_kg':p.peso, Idade:p.idade, Sexo:p.sexo, Cor_Pelo:p.corPelo, Comprimento_Pelo:p.comprimentoPelo,
      FotoDriveID:p.fotoDriveId||'', Foto_Base64:p.fotoDataUrl||''
    };
  }));
  const wsAg = XLSX.utils.json_to_sheet(state.appointments.map(function(a){
    const pet = state.pets.find(function(p){return p.id===a.petId;}) || {};
    const tutor = state.tutors.find(function(t){return t.id===pet.tutorId;}) || {};
    const serv = state.services.find(function(s){return s.id===a.servicoId;}) || {};
    return {
      ID:a.id, Data:a.data, Hora:a.hora, PetID:a.petId||'', Pet:pet.nome||'', Tutor:tutor.nome||'',
      Servico:serv.nome||'', 'Valor (R$)':a.valor, 'Custo (R$)':a.custo, Status:a.status, Observacoes:a.obs||'',
      LembreteEnviado: a.lembreteEnviado?'Sim':'Não'
    };
  }));
  const wsCons = XLSX.utils.json_to_sheet(state.consultas.map(function(c){
    const pet = state.pets.find(function(p){return p.id===c.petId;}) || {};
    const tutor = state.tutors.find(function(t){return t.id===pet.tutorId;}) || {};
    const vet = state.veterinarios.find(function(v){return v.id===c.veterinarioId;}) || {};
    return {
      ID:c.id, PetID:c.petId||'', Pet:pet.nome||'', Tutor:tutor.nome||'', Data:c.data,
      VeterinarioID:c.veterinarioId||'', Veterinario:vet.nome||'',
      'Peso_kg':c.peso||'', Retorno:c.retorno||'Não', Motivo:c.motivo||'', ExameFisico:c.exameFisico||'',
      Diagnostico:c.diagnostico||'', Tratamento:c.tratamento||'', ProximosPassos:c.proximosPassos||'',
      Observacoes:c.observacoes||'', CriadoEm:c.criadoEm||''
    };
  }));
  const wsVac = XLSX.utils.json_to_sheet(state.vacinas.map(function(v){
    const pet = state.pets.find(function(p){return p.id===v.petId;}) || {};
    const tutor = state.tutors.find(function(t){return t.id===pet.tutorId;}) || {};
    const vet = state.veterinarios.find(function(x){return x.id===v.veterinarioId;}) || {};
    return {
      ID:v.id, PetID:v.petId||'', Pet:pet.nome||'', Tutor:tutor.nome||'', Tipo:v.tipo,
      DataAplicacao:v.dataAplicacao, DataValidade:v.dataValidade||'', Fabricante:v.fabricante||'',
      Lote:v.lote||'', VeterinarioID:v.veterinarioId||'', Veterinario:vet.nome||(v.veterinario||''),
      Observacoes:v.observacoes||'', CriadoEm:v.criadoEm||''
    };
  }));
  const wsVet = XLSX.utils.json_to_sheet(state.veterinarios.map(function(v){
    return {ID:v.id, Nome:v.nome, CRMV_UF:v.crmvUf||'', CRMV_Numero:v.crmvNumero||'', CRMV:crmvFormatado(v), Email:v.email||'', MAPA:v.mapa||'', MensageriaAtiva: v.mensageriaAtiva?'Sim':'Não', Ativo: v.id===veterinarioAtivoId?'Sim':'Não'};
  }));
  const wsEstab = XLSX.utils.json_to_sheet([{
    Endereco_Rua:estabelecimento.enderecoRua||'', Endereco_Numero:estabelecimento.enderecoNumero||'',
    Endereco_Bairro:estabelecimento.enderecoBairro||'', Endereco_Cidade:estabelecimento.enderecoCidade||'',
    Endereco_UF:estabelecimento.enderecoUf||'', Endereco_CEP:estabelecimento.enderecoCep||'',
    Endereco:formatEndereco(estabelecimento), Email:estabelecimento.email||''
  }]);
  const wsReceitas = XLSX.utils.json_to_sheet(state.receitas.map(function(r){
    const pet = state.pets.find(function(p){return p.id===r.petId;}) || {};
    const tutor = state.tutors.find(function(t){return t.id===pet.tutorId;}) || {};
    const vet = state.veterinarios.find(function(v){return v.id===r.veterinarioId;}) || {};
    return {
      ID:r.id, PetID:r.petId||'', Pet:pet.nome||'', Tutor:tutor.nome||'', Data:r.data,
      VeterinarioID:r.veterinarioId||'', Veterinario:vet.nome||'', Prescricao:r.prescricao||'', CriadoEm:r.criadoEm||''
    };
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsServ, 'Servicos');
  XLSX.utils.book_append_sheet(wb, wsTut, 'Tutores');
  XLSX.utils.book_append_sheet(wb, wsPets, 'Pets');
  XLSX.utils.book_append_sheet(wb, wsAg, 'Agendamentos');
  XLSX.utils.book_append_sheet(wb, wsCons, 'Consultas');
  XLSX.utils.book_append_sheet(wb, wsVac, 'Vacinas');
  XLSX.utils.book_append_sheet(wb, wsVet, 'Veterinarios');
  XLSX.utils.book_append_sheet(wb, wsEstab, 'Estabelecimento');
  XLSX.utils.book_append_sheet(wb, wsReceitas, 'Receitas');
  return wb;
}
function exportXLSX(){
  const wb = buildWorkbook();
  XLSX.writeFile(wb, BACKUP_FILE_NAME);
  dirty = false;
  lastExportAt = new Date();
  render();
  toast('Planilha exportada com sucesso.');
}

function applyWorkbookToState(wb){
  const servSheet = wb.Sheets['Servicos'];
  const tutSheet = wb.Sheets['Tutores'];
  const petSheet = wb.Sheets['Pets'];
  const legacyCliSheet = wb.Sheets['Clientes_Pets']; /* formato antigo: tutor+pet numa linha só */
  const agSheet = wb.Sheets['Agendamentos'];
  const consSheet = wb.Sheets['Consultas'];
  const vacSheet = wb.Sheets['Vacinas'];
  const vetSheet = wb.Sheets['Veterinarios'];
  const estabSheet = wb.Sheets['Estabelecimento'];
  const receitasSheet = wb.Sheets['Receitas'];

  const newServices = servSheet ? XLSX.utils.sheet_to_json(servSheet, {defval:''}).map(function(r, i){
    return {
      id: Number(r.ID) || (i+1),
      nome: String(r.Nome||''),
      categoria: String(r.Categoria||'Veterinária'),
      status: String(r.Status||'Ativo'),
      valor: Number(r['Valor (R$)'])||0,
      custo: Number(r['Custo (R$)'])||0
    };
  }) : [];

  let newTutors = [];
  let newPets = [];

  if(tutSheet || petSheet){
    newTutors = tutSheet ? XLSX.utils.sheet_to_json(tutSheet, {defval:''}).map(function(r, i){
      return {
        id: Number(r.ID) || (i+1),
        nome: String(r.Nome||''),
        telefone: String(r.Telefone||''),
        cpf: String(r.CPF||''),
        email: String(r.Email||''),
        enderecoRua: String(r.Endereco_Rua||'') || String(r.Endereco||''),
        enderecoNumero: String(r.Endereco_Numero||''),
        enderecoBairro: String(r.Endereco_Bairro||''),
        enderecoCidade: String(r.Endereco_Cidade||''),
        enderecoUf: String(r.Endereco_UF||'').toUpperCase(),
        enderecoCep: String(r.Endereco_CEP||'')
      };
    }) : [];
    newPets = petSheet ? XLSX.utils.sheet_to_json(petSheet, {defval:''}).map(function(r, i){
      let tutorId = Number(r.TutorID)||0;
      if(!tutorId && r.Tutor){
        const t = newTutors.find(function(x){return x.nome===r.Tutor;});
        if(t) tutorId = t.id;
      }
      return {
        id: Number(r.ID) || (i+1),
        tutorId: tutorId,
        nome: String(r.Nome||''),
        especie: String(r['Especie_Raca']||''),
        peso: Number(r['Peso_kg'])||0,
        idade: String(r.Idade||''),
        sexo: String(r.Sexo||''),
        corPelo: String(r.Cor_Pelo||''),
        comprimentoPelo: String(r.Comprimento_Pelo||''),
        fotoDriveId: String(r.FotoDriveID||'') || null,
        fotoDataUrl: String(r.Foto_Base64||'') || null
      };
    }) : [];
  } else if(legacyCliSheet){
    /* migração automática de uma planilha exportada antes de tutores e pets serem separados */
    let nextTutorId = 1, nextPetId = 1;
    const tutorByKey = {};
    XLSX.utils.sheet_to_json(legacyCliSheet, {defval:''}).forEach(function(r){
      const nomeT = String(r.Tutor||'');
      const tel = String(r.Telefone||'');
      const key = nomeT+'|'+tel;
      let t = tutorByKey[key];
      if(!t){
        t = {id: nextTutorId++, nome:nomeT, telefone:tel, cpf:'', enderecoRua:'', enderecoNumero:'', enderecoBairro:'', enderecoCidade:'', enderecoUf:'', enderecoCep:''};
        tutorByKey[key] = t;
        newTutors.push(t);
      }
      newPets.push({
        id: nextPetId++, tutorId: t.id, nome: String(r.Pet||''), especie: String(r['Especie_Raca']||''),
        peso:0, idade:'', sexo:'', corPelo:'', comprimentoPelo:''
      });
    });
  }

  const newAppointments = agSheet ? XLSX.utils.sheet_to_json(agSheet, {defval:''}).map(function(r, i){
    let petId = Number(r.PetID)||0;
    if(!petId){
      const p = newPets.find(function(x){
        const t = newTutors.find(function(tt){return tt.id===x.tutorId;});
        return x.nome===r.Pet && t && t.nome===r.Tutor;
      });
      if(p) petId = p.id;
    }
    const serv = newServices.find(function(s){return s.nome===r.Servico;});
    return {
      id: Number(r.ID) || (i+1),
      data: String(r.Data||''),
      hora: String(r.Hora||''),
      petId: petId || null,
      servicoId: serv ? serv.id : null,
      valor: Number(r['Valor (R$)'])||0,
      custo: Number(r['Custo (R$)'])||0,
      status: String(r.Status||'Agendado'),
      obs: String(r.Observacoes||''),
      lembreteEnviado: String(r.LembreteEnviado||'').trim().toLowerCase()==='sim'
    };
  }) : [];

  const temAlgumDado = newServices.length || newTutors.length || newPets.length || newAppointments.length;
  if(temAlgumDado){
    state = {services:newServices, tutors:newTutors, pets:newPets, appointments:newAppointments};
    ids.service = Math.max(0, 0, ...newServices.map(function(s){return s.id;})) + 1;
    ids.tutor = Math.max(0, 0, ...newTutors.map(function(t){return t.id;})) + 1;
    ids.pet = Math.max(0, 0, ...newPets.map(function(p){return p.id;})) + 1;
    ids.appointment = Math.max(0, 0, ...newAppointments.map(function(a){return a.id;})) + 1;
  }

  const newVeterinarios = vetSheet ? XLSX.utils.sheet_to_json(vetSheet, {defval:''}).map(function(r, i){
    const crmvUf = String(r.CRMV_UF||'').toUpperCase();
    const crmvNumero = String(r.CRMV_Numero||'');
    const v = { id: Number(r.ID) || (i+1), nome: String(r.Nome||''), crmvUf:crmvUf, crmvNumero:crmvNumero, email: String(r.Email||''), mapa: String(r.MAPA||''), mensageriaAtiva: String(r.MensageriaAtiva||'').trim().toLowerCase()==='sim', __ativo: String(r.Ativo||'').trim().toLowerCase()==='sim' };
    if(!crmvUf || !crmvNumero){
      /* formato antigo: uma única coluna de texto livre para o CRMV */
      const textoAntigo = String(r.CRMV||'').trim();
      if(textoAntigo){
        const ufRegex = new RegExp('\\b('+UFS_BR.join('|')+')\\b', 'i');
        const ufMatch = textoAntigo.match(ufRegex);
        const numMatch = textoAntigo.match(/\d+/);
        if(ufMatch && numMatch){ v.crmvUf = ufMatch[1].toUpperCase(); v.crmvNumero = numMatch[0]; }
        else { v.crmvLegado = textoAntigo; }
      }
    }
    return v;
  }) : [];
  if(temAlgumDado || newVeterinarios.length){
    const vetAtivoImportado = newVeterinarios.find(function(v){ return v.__ativo; });
    newVeterinarios.forEach(function(v){ delete v.__ativo; });
    state.veterinarios = newVeterinarios;
    ids.veterinario = Math.max(0, 0, ...newVeterinarios.map(function(v){return v.id;})) + 1;
    veterinarioAtivoId = vetAtivoImportado ? vetAtivoImportado.id : null;
  }

  const newConsultas = consSheet ? XLSX.utils.sheet_to_json(consSheet, {defval:''}).map(function(r, i){
    let petId = Number(r.PetID)||0;
    if(!petId){
      const p = newPets.find(function(x){
        const t = newTutors.find(function(tt){return tt.id===x.tutorId;});
        return x.nome===r.Pet && t && t.nome===r.Tutor;
      });
      if(p) petId = p.id;
    }
    let veterinarioId = Number(r.VeterinarioID)||0;
    if(!veterinarioId && r.Veterinario){
      const vet = newVeterinarios.find(function(v){ return v.nome===r.Veterinario; });
      if(vet) veterinarioId = vet.id;
    }
    return {
      id: Number(r.ID) || (i+1),
      petId: petId || null,
      data: String(r.Data||''),
      veterinarioId: veterinarioId || null,
      peso: Number(r['Peso_kg'])||0,
      retorno: String(r.Retorno||'Não'),
      motivo: String(r.Motivo||''),
      exameFisico: String(r.ExameFisico||''),
      diagnostico: String(r.Diagnostico||''),
      tratamento: String(r.Tratamento||''),
      proximosPassos: String(r.ProximosPassos||''),
      observacoes: String(r.Observacoes||''),
      criadoEm: String(r.CriadoEm||'')
    };
  }) : [];
  if(temAlgumDado || newConsultas.length){
    state.consultas = newConsultas;
    ids.consulta = Math.max(0, 0, ...newConsultas.map(function(c){return c.id;})) + 1;
  }

  const newVacinas = vacSheet ? XLSX.utils.sheet_to_json(vacSheet, {defval:''}).map(function(r, i){
    let petId = Number(r.PetID)||0;
    if(!petId){
      const p = newPets.find(function(x){
        const t = newTutors.find(function(tt){return tt.id===x.tutorId;});
        return x.nome===r.Pet && t && t.nome===r.Tutor;
      });
      if(p) petId = p.id;
    }
    let veterinarioId = Number(r.VeterinarioID)||0;
    if(!veterinarioId && r.Veterinario){
      const vet = newVeterinarios.find(function(v){ return v.nome===r.Veterinario; });
      if(vet) veterinarioId = vet.id;
    }
    return {
      id: Number(r.ID) || (i+1),
      petId: petId || null,
      tipo: String(r.Tipo||''),
      dataAplicacao: String(r.DataAplicacao||''),
      dataValidade: String(r.DataValidade||''),
      fabricante: String(r.Fabricante||''),
      lote: String(r.Lote||''),
      veterinarioId: veterinarioId || null,
      veterinario: veterinarioId ? '' : String(r.Veterinario||''),
      observacoes: String(r.Observacoes||''),
      criadoEm: String(r.CriadoEm||'')
    };
  }) : [];
  if(temAlgumDado || newConsultas.length || newVacinas.length){
    state.vacinas = newVacinas;
    ids.vacina = Math.max(0, 0, ...newVacinas.map(function(v){return v.id;})) + 1;
  }

  if(estabSheet){
    const estabRows = XLSX.utils.sheet_to_json(estabSheet, {defval:''});
    if(estabRows.length){
      const r = estabRows[0];
      estabelecimento = {
        enderecoRua: String(r.Endereco_Rua||'') || String(r.Endereco||''),
        enderecoNumero: String(r.Endereco_Numero||''),
        enderecoBairro: String(r.Endereco_Bairro||''),
        enderecoCidade: String(r.Endereco_Cidade||''),
        enderecoUf: String(r.Endereco_UF||'').toUpperCase(),
        enderecoCep: String(r.Endereco_CEP||''),
        email: String(r.Email||'')
      };
    }
  }

  const newReceitas = receitasSheet ? XLSX.utils.sheet_to_json(receitasSheet, {defval:''}).map(function(r, i){
    let petId = Number(r.PetID)||0;
    if(!petId){
      const p = newPets.find(function(x){
        const t = newTutors.find(function(tt){return tt.id===x.tutorId;});
        return x.nome===r.Pet && t && t.nome===r.Tutor;
      });
      if(p) petId = p.id;
    }
    let veterinarioId = Number(r.VeterinarioID)||0;
    if(!veterinarioId && r.Veterinario){
      const vet = newVeterinarios.find(function(v){ return v.nome===r.Veterinario; });
      if(vet) veterinarioId = vet.id;
    }
    return {
      id: Number(r.ID) || (i+1),
      petId: petId || null,
      data: String(r.Data||''),
      veterinarioId: veterinarioId || null,
      prescricao: String(r.Prescricao||''),
      criadoEm: String(r.CriadoEm||'')
    };
  }) : [];
  if(temAlgumDado || newConsultas.length || newVacinas.length || newReceitas.length){
    state.receitas = newReceitas;
    ids.receita = Math.max(0, 0, ...newReceitas.map(function(r){return r.id;})) + 1;
  }

  return !!(temAlgumDado || newConsultas.length || newVacinas.length || newVeterinarios.length || newReceitas.length);
}

function importXLSXFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(dirty && !confirm('Você tem alterações não exportadas. Importar uma planilha vai substituir os dados atuais. Deseja continuar?')){
    event.target.value='';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      applyWorkbookToState(wb);
      dirty = false;
      currentTab = 'painel';
      render();
      scheduleAutoSave();
      toast('Planilha importada com sucesso.');
    }catch(err){
      console.error(err);
      alert('Não foi possível ler esse arquivo. Confira se é uma planilha exportada pela Oca Pet.');
    }
    event.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- start ---------- */
/* O sistema não carrega os dados nem libera o app antes do login com Google —
   renderAuthGate() mantém a tela de entrada (ou o aviso de configuração) até que
   handleGoogleTokenResponse() confirme o login e chame render() + driveInitialSync(). */
renderAuthGate();
initGoogleAuth();

/* O autosave espera 700ms de silêncio antes de gravar (para não gravar a cada
   tecla). Se a pessoa trocar de aba, minimizar ou fechar o navegador antes desse
   prazo, o salvamento pendente seria perdido — por isso disparamos na hora assim
   que a aba fica oculta, e avisamos se ainda houver algo em andamento ao fechar. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden' && autoSaveTimer){
    clearTimeout(autoSaveTimer);
    doAutoSave();
  }
});
window.addEventListener('beforeunload', function(e){
  if(autoSaveStatus==='saving'){
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
