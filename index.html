<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oca Pet — Sistema do Consultório Veterinário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --canopy:#472818;
    --canopy-dark:#2A160D;
    --canopy-light:#6B4530;
    --ochre:#C68A4E;
    --ochre-dark:#A66E39;
    --ochre-soft:#F3E0C3;
    --parchment:#FBF3E4;
    --surface:#FFFFFF;
    --ink:#2C1810;
    --ink-soft:#8A7261;
    --line:#E8D9C0;
    --brick:#B5533B;
    --brick-soft:#F5DED0;
    --sage:#4C8368;
    --sage-soft:#E1EEE6;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --radius:10px;
    --shadow:0 1px 2px rgba(42,22,13,.07), 0 6px 20px rgba(42,22,13,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--parchment);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--canopy-dark); letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); font-size:14px;}

  /* ---------- Layout shell ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex:0 0 230px;
    background:var(--canopy);
    color:#EFE1CC;
    display:flex; flex-direction:column;
    padding:22px 16px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 4px 22px 4px;}
  .brand img{flex:0 0 auto; display:block;}
  .brand-word{font-family:var(--font-display); font-weight:700; font-size:20px; color:#fff; line-height:1;}
  .brand-sub{font-size:10.5px; color:var(--ochre); letter-spacing:.09em; text-transform:uppercase; margin-top:3px;}
  nav{display:flex; flex-direction:column; gap:3px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    background:transparent; border:none; color:#D8C6B2;
    padding:10px 12px; border-radius:8px; font-size:14.5px; font-weight:500;
    text-align:left; width:100%; position:relative;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:var(--ochre); color:var(--canopy-dark); font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-dot{
    position:absolute; right:10px; top:9px;
    width:7px; height:7px; border-radius:50%; background:var(--brick);
    box-shadow:0 0 0 2px var(--canopy);
  }
  .sidebar-footer{margin-top:14px;}
  .thatch{
    height:8px; margin:14px 0 12px 0; border-radius:4px;
    background-image:repeating-linear-gradient(115deg, var(--ochre) 0 3px, transparent 3px 9px);
    opacity:.55;
  }
  .sidebar-footer small{color:#C2AC93; font-size:11.5px; line-height:1.5; display:block;}

  .main{flex:1; min-width:0; padding:30px 36px 60px 36px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ochre-dark); margin-bottom:6px; display:block;}
  .page-head h1{font-size:27px;}
  .page-head .sub{color:var(--ink-soft); font-size:14px; margin-top:5px;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;
    border:1px solid transparent; transition:filter .12s ease, background .12s ease;
  }
  .btn-primary{background:var(--canopy); color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-accent{background:var(--ochre); color:var(--canopy-dark);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; color:var(--canopy); border-color:var(--line);}
  .btn-ghost:hover{background:#F1E3CB;}
  .btn-danger{background:transparent; color:var(--brick); border-color:var(--brick-soft);}
  .btn-danger:hover{background:var(--brick-soft);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .icon-btn:hover{background:#F1E3CB; color:var(--ink);}
  .icon-btn.danger:hover{background:var(--brick-soft); color:var(--brick); border-color:var(--brick-soft);}

  /* ---------- Cards / stats ---------- */
  .grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);}
  .stat-card .value{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--canopy-dark); margin-top:6px;}
  .stat-card .value.accent{color:var(--ochre-dark);}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px;
  }
  .card + .card{margin-top:16px;}
  .card h2{font-size:18px; margin-bottom:4px;}
  .card .card-sub{color:var(--ink-soft); font-size:13px; margin-bottom:14px;}

  /* ---------- Pills / filters ---------- */
  .pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .pill{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .pill.active{background:var(--canopy); color:#fff; border-color:var(--canopy);}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:560px;}
  thead th{
    text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); padding:0 12px 10px 12px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:13px 12px; border-bottom:1px solid #F0E2C8; font-size:14px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF2E2;}
  .cell-actions{display:flex; gap:6px; justify-content:flex-end;}
  .badge{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:600;
  }
  .badge-vet{background:var(--sage-soft); color:var(--sage);}
  .badge-banho{background:var(--ochre-soft); color:var(--ochre-dark);}
  .badge-agendado{background:var(--ochre-soft); color:var(--ochre-dark);}
  .badge-concluido{background:var(--sage-soft); color:var(--sage);}
  .badge-cancelado{background:var(--brick-soft); color:var(--brick);}
  .muted{color:var(--ink-soft);}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- Empty states ---------- */
  .empty{
    text-align:center; padding:46px 20px; color:var(--ink-soft);
  }
  .empty svg{margin-bottom:12px; opacity:.5;}
  .empty p{margin:0 0 16px 0; font-size:14px;}

  /* ---------- Forms ---------- */
  .form-panel{
    border:1px dashed var(--ochre-dark); background:var(--ochre-soft);
    border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
  }
  .form-panel h2{font-size:16px; margin-bottom:14px;}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 14px;}
  .form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:12px; font-weight:600; color:var(--canopy-dark);}
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:7px; padding:9px 11px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--canopy-light); outline-offset:1px; border-color:var(--canopy-light);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field textarea.lg{min-height:110px;}
  .field .hint{font-size:11.5px; color:var(--ink-soft);}
  .checkbox-field label{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer;}
  .checkbox-field input[type="checkbox"]{width:16px; height:16px; flex:0 0 auto; accent-color:var(--canopy);}
  .checkbox-field .hint{display:block; margin-top:4px; margin-left:24px;}
  .form-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Backup tab ---------- */
  .backup-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  .backup-card{border:1px solid var(--line); border-radius:var(--radius); padding:20px; background:#fff;}
  .backup-card svg{color:var(--canopy);}
  .backup-card h3{font-size:15.5px; margin:10px 0 6px 0;}
  .backup-card p{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:0 0 14px 0;}
  .status-line{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-top:14px;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--sage);}
  .status-dot.warn{background:var(--brick);}

  /* ---------- Auto-save indicator (sidebar) ---------- */
  .autosave-indicator{font-size:11.5px; color:#C9B49C; margin-top:2px;}
  .autosave-indicator .autosave-main{display:flex; align-items:center; gap:7px;}
  .autosave-indicator .drive-storage{margin-top:3px; font-size:10.5px; color:#B9A489;}
  .mini-dot{width:7px; height:7px; border-radius:50%; background:var(--sage); flex:0 0 auto;}
  .mini-dot.warn{background:var(--ochre); animation:pulse 1.1s ease-in-out infinite;}
  .mini-dot.error{background:#E08A6F;}
  .mini-dot.muted{background:#8A7261;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  /* ---------- Painel Mensal ---------- */
  .month-bar-track{height:8px; background:#F0E2C8; border-radius:999px; overflow:hidden;}
  .month-bar-fill{height:100%; background:var(--ochre); border-radius:999px;}

  /* ---------- Seleção de paciente (Nova Consulta / Prontuários) ---------- */
  .pet-pick-list{display:flex; flex-direction:column; gap:8px;}
  .pet-pick-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; transition:border-color .12s ease, background .12s ease;
  }
  .pet-pick-row .pet-pick-info{min-width:0; flex:1 1 auto; overflow:hidden;}
  .pet-pick-row .pet-pick-info strong{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pet-pick-row > span{flex:0 0 auto; white-space:nowrap;}
  .pet-pick-row:hover{border-color:var(--canopy-light); background:#FBF2E2;}
  .private-note{margin-top:12px; padding:10px 12px; background:var(--parchment); border-radius:8px;}
  .private-note .label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px;}
  .prontuario-field{margin-top:12px;}
  .prontuario-field .label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px;}
  .prontuario-field .txt{font-size:13.5px; white-space:pre-wrap; line-height:1.5;}

  /* ---------- Tela de login (Google) ---------- */
  .login-gate{
    position:fixed; inset:0; z-index:100; overflow-y:auto;
    background:radial-gradient(circle at 20% 15%, #6B4530 0%, var(--canopy) 45%, var(--canopy-dark) 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--surface); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.35);
    padding:38px 34px; width:100%; max-width:380px; text-align:center; margin:auto;
  }
  .login-card img{height:64px; width:auto; margin-bottom:14px;}
  .login-card h1{font-size:21px; margin-bottom:8px;}
  .login-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 22px 0;}
  .google-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:11px 16px; border-radius:8px; border:1px solid #DADCE0;
    background:#fff; color:#3C4043; font-size:14.5px; font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.08); transition:box-shadow .15s ease, background .15s ease;
  }
  .google-btn:hover{background:#F7F8F8; box-shadow:0 1px 4px rgba(0,0,0,.14);}
  .login-config-warning{
    text-align:left; background:var(--brick-soft); border:1px solid #E9C6B8; border-radius:10px;
    padding:14px 16px; font-size:12.5px; color:var(--ink); line-height:1.6;
  }
  .login-config-warning code{background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:11.5px;}
  .user-chip{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .user-chip img{width:24px; height:24px; border-radius:50%; flex:0 0 auto;}
  .user-chip .who{font-size:11.5px; color:#EFE1CC; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .user-chip button{background:none; border:none; color:var(--ochre); font-size:11px; font-weight:600; padding:0; cursor:pointer; text-decoration:underline;}

  /* ---------- Banner de conexão automática ---------- */
  .connect-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--ochre-soft); border:1px solid var(--ochre);
    border-radius:var(--radius); padding:13px 18px; margin-bottom:20px;
  }
  .connect-banner .txt strong{color:var(--canopy-dark); font-size:14px;}
  .connect-banner .txt div{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:22px; right:22px; background:var(--canopy-dark); color:#fff;
    padding:12px 18px; border-radius:8px; font-size:13.5px; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{opacity:1; transform:translateY(0);}

  /* ---------- Lightbox de foto (visualização ampliada) ---------- */
  .foto-lightbox{
    position:fixed; inset:0; z-index:150;
    background:rgba(20,10,5,.82);
    display:flex; align-items:center; justify-content:center; padding:32px;
    cursor:zoom-out;
  }
  .foto-lightbox img{
    max-width:min(90vw,420px); max-height:80vh; border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.5); cursor:default; background:#fff;
  }
  .foto-lightbox-close{
    position:absolute; top:20px; right:24px;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.15); color:#fff;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .foto-lightbox-close:hover{background:rgba(255,255,255,.28);}

  /* ---------- Responsive ---------- */
  @media (max-width:880px){
    .app-shell{flex-direction:column;}
    .sidebar{
      width:100%; flex:none; height:auto; position:sticky; top:0; z-index:20;
      padding:12px 14px;
    }
    .brand{padding:0 2px 10px 2px;}
    .brand img{height:44px;}
    nav{flex-direction:row; overflow-x:auto; gap:6px; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
    .nav-item{white-space:nowrap; padding:10px 14px;}
    .sidebar-footer{
      margin-top:8px; display:flex; align-items:center; justify-content:space-between;
      gap:10px; flex-wrap:wrap;
    }
    .thatch{display:none;}
    .sidebar-footer > small{display:none;}
    .autosave-indicator{margin-top:0;}
    .user-chip{margin-top:0;}

    .main{padding:18px 14px 40px 14px;}
    .grid-stats{grid-template-columns:repeat(2,1fr); gap:10px;}
    .form-grid, .form-grid.cols-3{grid-template-columns:1fr;}
    .field.span-2{grid-column:span 1;}
    .backup-grid{grid-template-columns:1fr;}

    /* alvos de toque mais confortáveis */
    .icon-btn{width:38px; height:38px;}
    .btn{padding:11px 16px;}
    .btn-sm{padding:9px 14px;}
    .pill{padding:9px 15px;}

    /* campos abaixo de 16px fazem o iOS dar zoom automático ao focar — evitamos isso */
    .field input, .field select, .field textarea{font-size:16px;}

    .page-head{gap:12px;}
    .page-head h1{font-size:23px;}
    .btn-row{width:100%;}

    .login-card{padding:30px 22px;}
  }

  @media (max-width:560px){
    .grid-stats{grid-template-columns:1fr 1fr; gap:8px;}
    .stat-card{padding:13px 14px;}
    .stat-card .value{font-size:21px;}
    .page-head h1{font-size:20px;}
    .eyebrow{font-size:10.5px;}
    .card{padding:15px;}
    .form-panel{padding:14px 15px;}
    .pill-row{gap:6px;}
    .btn-row > .btn{flex:1 1 auto; justify-content:center;}
    .nav-item span{font-size:13.5px;}
    #toast{left:16px; right:16px; bottom:16px; text-align:center; white-space:normal;}
    .backup-card{padding:16px;}
  }
</style>
</head>
<body>
  <div id="toast"></div>
  <div id="foto-lightbox" class="foto-lightbox" style="display:none;" onclick="fecharFotoLightbox()"></div>
  <div id="login-gate" class="login-gate"></div>
  <div class="app-shell" id="app-shell" style="display:none;">

/* =========================================================
   LOGIN COM GOOGLE — CONFIGURAÇÃO OBRIGATÓRIA
   =========================================================
   Para este login funcionar de verdade, alguém do consultório precisa:
   1. Criar um projeto em https://console.cloud.google.com
   2. Ativar a "Google Drive API" E a "Gmail API" nesse projeto (menu "APIs e
      serviços" > "Biblioteca") — a Gmail API é usada só para os lembretes
      automáticos de agendamento por email.
   3. Configurar a "Tela de consentimento OAuth" (tipo Externo, com o e-mail do consultório)
   4. Em "Credenciais" > "Criar credenciais" > "ID do cliente OAuth", tipo "Aplicativo da Web"
   5. Em "Origens JavaScript autorizadas", adicionar o endereço https:// exato onde este
      arquivo vai ficar hospedado (ex.: https://ocapet.suaclinica.com.br). Isso é obrigatório:
      o login do Google NÃO funciona abrindo este arquivo direto do computador (file://)
      nem dentro de uma pré-visualização — precisa ser um endereço https real.
   6. Copiar o "ID do cliente" gerado e colar na constante abaixo, entre aspas.
   Enquanto essa constante não for preenchida, a tela de entrada mostra um aviso
   explicando isso, em vez do botão de login.

   IMPORTANTE sobre os lembretes automáticos por email: este sistema não tem servidor —
   o envio só acontece enquanto o navegador estiver aberto, com a conta logada, checando
   a cada minuto se algum agendamento está a 25 minutos de acontecer. Fechar a aba ou o

function todayISO(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function formatFullDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
}
function formatDateBR(iso){
  if(!iso) return '—';
  const p = iso.split('-');
  if(p.length!==3) return iso;
  return p[2]+'/'+p[1]+'/'+p[0];
}
function formatDiaMesAno(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
}

  return [estabelecimento.enderecoCidade, estabelecimento.enderecoUf].filter(Boolean).join('/');
}
function localEData(iso){
  const local = localDoEstabelecimento();
  return (local?(local+', '):'') + formatDiaMesAno(iso);
}
function formatCurrency(n){
  const v = Number(n)||0;
  return 'R$ ' + v.toFixed(2).replace('.', ',');
}
function esc(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Monta o endereço completo a partir das partes (rua, número, bairro, cidade, UF, CEP),
   usado tanto para o responsável quanto para o estabelecimento. Omite partes vazias. */
function formatEndereco(obj){
  if(!obj) return '';
  const partes = [];
  const ruaNum = [obj.enderecoRua, obj.enderecoNumero].filter(Boolean).join(', ');
  if(ruaNum) partes.push(ruaNum);
  if(obj.enderecoBairro) partes.push(obj.enderecoBairro);
  const cidadeUf = [obj.enderecoCidade, obj.enderecoUf].filter(Boolean).join('/');
  if(cidadeUf) partes.push(cidadeUf);
  if(obj.enderecoCep) partes.push('CEP '+obj.enderecoCep);
  return partes.join(' - ');
}

let tokenRefreshWaiters = [];
function entrarComGoogle(){
  if(!googleTokenClient){ toast('Login com Google ainda não está pronto — aguarde um instante.'); return; }

async function handleGoogleTokenResponse(resp){
  if(!resp || resp.error){
    console.error('Erro no login com Google:', resp);
    if(!auth.signedIn) toast('Não foi possível entrar com o Google.');
    else toast('Não foi possível renovar a sessão do Google — talvez seja preciso entrar de novo.');
    tokenRefreshWaiters.forEach(function(fn){ fn(false); });
    tokenRefreshWaiters = [];
    return;
  }
  auth.accessToken = resp.access_token;
  auth.tokenExpiresAt = Date.now() + (Number(resp.expires_in||3600) * 1000);
  const primeiroLogin = !auth.signedIn;
  if(primeiroLogin){
    try{
      const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: {Authorization: 'Bearer '+auth.accessToken}
      });
      const info = await r.json();
      auth.email = info.email || null;
      auth.name = info.name || null;
      auth.picture = info.picture || null;
    }catch(err){
      console.error('Não foi possível obter os dados da conta Google:', err);
    }
    auth.signedIn = true;
  }
  tokenRefreshWaiters.forEach(function(fn){ fn(true); });
  tokenRefreshWaiters = [];
  if(primeiroLogin){
    renderAuthGate();
    render();
    driveInitialSync();
    iniciarVerificacaoLembretes();
  }
}

/* Pede um novo token sem popup (usa a sessão já concedida). Usado tanto de forma
   preventiva (perto de expirar) quanto reativa (quando uma chamada volta com 401). */
function renovarTokenSilenciosamente(){
  return new Promise(function(resolve){
    if(!googleTokenClient){ resolve(false); return; }
    tokenRefreshWaiters.push(resolve);
    googleTokenClient.requestAccessToken({prompt:''});
  });
}
async function garantirTokenValido(){

}

/* ---------- Chamadas ao Google Drive (REST, escopo drive.file) ----------
   Toda chamada passa por aqui: garante um token válido antes de sair, e — ponto
   crítico — verifica se a resposta veio com erro. O fetch() do navegador NÃO rejeita
   a Promise para respostas HTTP de erro (403, 404, etc.), só para falha de rede; sem
   essa checagem explícita, uma resposta de erro (ex.: "Drive API desativada no
   projeto") seria lida como se fosse um resultado válido e vazio, dando a falsa
   impressão de que tudo foi salvo quando na verdade nada foi gravado no Drive. */
async function driveErrorFromResponse(r){
  let msg = 'Erro '+r.status+' na chamada ao Google Drive.';
  try{
    const data = await r.json();
    if(data && data.error && data.error.message) msg = data.error.message;
  }catch(err){ /* corpo sem JSON — mantém a mensagem genérica */ }
  return new Error(msg);
}
async function driveApiFetch(url, options){
  await garantirTokenValido();
  options = options || {};
  options.headers = Object.assign({}, options.headers, {Authorization: 'Bearer '+auth.accessToken});
  let r = await fetch(url, options);
  if(r.status===401){
    const renovou = await renovarTokenSilenciosamente();
    if(!renovou) throw new Error('Sessão do Google expirou — entre novamente.');
    options.headers.Authorization = 'Bearer '+auth.accessToken;
    r = await fetch(url, options);
  }
  if(!r.ok){ throw await driveErrorFromResponse(r); }
  return r;
}
function buildMultipartBody(boundary, metadata, bytes){
  const delimiter = '\r\n--'+boundary+'\r\n';
  const closeDelim = '\r\n--'+boundary+'--';
  const metaPart = delimiter+'Content-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata);
  const fileHeader = delimiter+'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\r\n\r\n';
  return new Blob([metaPart, fileHeader, bytes, closeDelim]);
}
async function driveFindFile(){
  const q = encodeURIComponent("name='"+BACKUP_FILE_NAME+"' and trashed=false");
  const r = await driveApiFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)&spaces=drive');
  const data = await r.json();
  if(!data || !Array.isArray(data.files)) throw new Error('Resposta inesperada do Google Drive ao procurar o arquivo.');
  return data.files.length ? data.files[0] : null;
}
async function driveDownloadFile(fileId){
  const r = await driveApiFetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media');
  const buf = await r.arrayBuffer();
  return new Uint8Array(buf);
}
async function driveCreateFile(bytes){
  const boundary = 'ocapetbdry'+Date.now();
  const metadata = {name: BACKUP_FILE_NAME, mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
  const body = buildMultipartBody(boundary, metadata, bytes);
  const r = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+boundary},
    body: body
  });
  const data = await r.json();
  if(!data || !data.id) throw new Error('O Google Drive não retornou um ID para o arquivo criado.');
  return data.id;
}

/* ---------- Fotos de pet: pasta BDVETFOTOS no Google Drive ---------- */
function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(parts[1]);
  const arr = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function garantirPastaFotos(){
  if(bdvetFotosFolderId) return bdvetFotosFolderId;
  if(!auth.signedIn) return null;
  try{
    const q = encodeURIComponent("name='BDVETFOTOS' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const r = await driveApiFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive');
    const data = await r.json();
    if(data.files && data.files.length){
      bdvetFotosFolderId = data.files[0].id;
    } else {
      const createR = await driveApiFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name:'BDVETFOTOS', mimeType:'application/vnd.google-apps.folder'})
      });
      const createData = await createR.json();
      if(!createData || !createData.id) throw new Error('Não foi possível criar a pasta BDVETFOTOS.');
      bdvetFotosFolderId = createData.id;
    }
  }catch(err){
    console.error('Não foi possível preparar a pasta BDVETFOTOS no Drive:', err);
    return null;
  }
  return bdvetFotosFolderId;
}
async function uploadFotoPetParaDrive(pet, dataUrl){
  try{
    const folderId = await garantirPastaFotos();
    if(!folderId) return; /* a foto já está salva localmente (fotoDataUrl); tenta de novo depois */
    const blob = dataUrlToBlob(dataUrl);
    const arrBuf = await blob.arrayBuffer();
    const bytes = new Uint8Array(arrBuf);
    if(pet.fotoDriveId){
      await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files/'+pet.fotoDriveId+'?uploadType=media', {
        method:'PATCH', headers:{'Content-Type':'image/jpeg'}, body:bytes
      });
    } else {
      const fileName = 'pet-'+pet.id+'-'+slugify(pet.nome)+'.jpg';
      const boundary = 'ocapetfotobdry'+Date.now();
      const metadata = {name:fileName, parents:[folderId], mimeType:'image/jpeg'};
      const body = buildMultipartBody(boundary, metadata, bytes);
      const r = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body:body
      });
      const data = await r.json();
      if(data && data.id){ pet.fotoDriveId = data.id; markDirty(); }
    }
  }catch(err){
    console.error('Não foi possível salvar a foto no Google Drive:', err);
  }
}

/* Lê a imagem escolhida, recorta em quadrado e redimensiona para um thumbnail pequeno
   antes de guardar — mantém o cadastro leve e rápido de exibir. */
function handleFotoPetChange(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type || file.type.indexOf('image/')!==0){ toast('Selecione um arquivo de imagem.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const tamanho = 160;
      const canvas = document.createElement('canvas');
      canvas.width = tamanho; canvas.height = tamanho;
      const ctx2d = canvas.getContext('2d');
      const minLado = Math.min(img.width, img.height);
      const sx = (img.width-minLado)/2, sy = (img.height-minLado)/2;
      ctx2d.drawImage(img, sx, sy, minLado, minLado, 0, 0, tamanho, tamanho);
      petFotoPendente = canvas.toDataURL('image/jpeg', 0.82);
      const preview = document.getElementById('pet-foto-preview');
      if(preview){
        preview.innerHTML = '<img src="'+petFotoPendente+'" style="width:64px; height:64px; border-radius:50%; object-fit:cover;">';
      }
    };
    img.onerror = function(){ toast('Não foi possível ler essa imagem.'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- Lembretes de agendamento por email (Gmail API) ----------
   Roda só enquanto esta aba está aberta e a conta Google logada: a cada minuto,
   verifica se algum agendamento "Agendado" está a 25 minutos ou menos de acontecer
   (e ainda não aconteceu) e, se o veterinário ativo tiver os lembretes ligados,
   envia um email pra ele. Não existe servidor por trás disso — é só um setInterval
   no navegador.
   Importante: a checagem dispara assim que o agendamento cruza a marca de 25 minutos
   e continua "verdadeira" até ser enviada — em vez de exigir um instante exato (ex.:
   "entre 24 e 25 minutos"), o que falhava sempre que a aba ficava em segundo plano e
   o navegador atrasava o setInterval, pulando aquela janela de 1 minuto por completo. */
let lembretesTimer = null;
let ultimaVerificacaoLembretes = null;
let lembretesEnviadosSessao = 0;
let ultimoErroLembretes = null;

function iniciarVerificacaoLembretes(){
  if(lembretesTimer) return;
  verificarLembretesAgendamentos();
  lembretesTimer = setInterval(verificarLembretesAgendamentos, 60000);
}
function pararVerificacaoLembretes(){
  if(lembretesTimer){ clearInterval(lembretesTimer); lembretesTimer = null; }
}

function base64UrlEncode(str){
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function enviarEmailGmail(destinatario, assunto, corpo){
  const assuntoCodificado = '=?UTF-8?B?'+btoa(unescape(encodeURIComponent(assunto)))+'?=';
  const mensagem = ''+
    'To: '+destinatario+'\r\n'+
    'Subject: '+assuntoCodificado+'\r\n'+
    'Content-Type: text/plain; charset=UTF-8\r\n\r\n'+
    corpo;
  const raw = base64UrlEncode(mensagem);
  return driveApiFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({raw:raw})
  });
}

function verificarLembretesAgendamentos(){
  ultimaVerificacaoLembretes = new Date();
  renderStatusLembretes();
  if(!auth.signedIn) return;
  const vetAtivo = veterinarioAtivoId ? state.veterinarios.find(function(v){ return v.id===veterinarioAtivoId; }) : null;
  if(!vetAtivo || !vetAtivo.mensageriaAtiva || !vetAtivo.email) return;
  const agora = new Date();
  state.appointments.forEach(function(a){
    if(a.status!=='Agendado' || a.lembreteEnviado) return;
    if(!a.data || !a.hora) return;
    const dataHora = new Date(a.data+'T'+a.hora+':00');
    if(isNaN(dataHora.getTime())) return;
    const minutosRestantes = (dataHora.getTime() - agora.getTime()) / 60000;
    /* dispara assim que faltar 25 minutos ou menos (e o horário ainda não passou);
       como cada agendamento só é marcado uma vez, não duplica em checagens seguintes */
    if(minutosRestantes<=25 && minutosRestantes>0){
      dispararLembreteAgendamento(a, vetAtivo);
    }
  });
}

async function dispararLembreteAgendamento(a, vetAtivo){
  a.lembreteEnviado = true; /* marca antes de enviar, pra nunca duplicar mesmo se a rede falhar */
  markDirty();
  try{
    const pet = state.pets.find(function(p){ return p.id===a.petId; });
    const tutor = pet ? state.tutors.find(function(t){ return t.id===pet.tutorId; }) : null;
    const serv = state.services.find(function(s){ return s.id===a.servicoId; });
    const assunto = 'Lembrete: agendamento em breve — '+(pet?pet.nome:'paciente');
    const corpo = ''+
      'Você tem um agendamento em breve na Oca Pet (até 25 minutos).\n\n'+
      'Serviço: '+(serv?serv.nome:'—')+'\n'+
      'Pet: '+(pet?pet.nome:'—')+'\n'+
      'Horário: '+formatDateBR(a.data)+' às '+a.hora+'\n'+
      'Responsável: '+(tutor?tutor.nome:'—')+'\n'+
      'Telefone do responsável: '+(tutor&&tutor.telefone?tutor.telefone:'—')+'\n';
    await enviarEmailGmail(vetAtivo.email, assunto, corpo);
    lembretesEnviadosSessao++;
    ultimoErroLembretes = null;
  }catch(err){
    console.error('Não foi possível enviar o lembrete por email:', err);
    ultimoErroLembretes = (err&&err.message) ? err.message : 'Erro desconhecido';
  }
  renderStatusLembretes();
}

function verificarLembretesAgora(){
  verificarLembretesAgendamentos();
  toast('Verificação de lembretes executada agora.');
}

/* Mantém visível, em Configurações, o que está de fato acontecendo com os lembretes —
   pra não ficar tentando adivinhar se está funcionando ou não. */
function renderStatusLembretes(){
  const el = document.getElementById('lembretes-status');
  if(!el) return;
  const vetAtivo = veterinarioAtivoId ? state.veterinarios.find(function(v){ return v.id===veterinarioAtivoId; }) : null;
  let situacao;
  if(!auth.signedIn){
    situacao = 'Aguardando login com Google.';
  } else if(!lembretesTimer){
    situacao = 'Verificação automática ainda não foi iniciada.';
  } else if(!vetAtivo){
    situacao = 'Nenhum veterinário está marcado como ativo — defina um em "Veterinários" acima.';
  } else if(!vetAtivo.email){
    situacao = 'O veterinário ativo ("'+esc(vetAtivo.nome)+'") não tem email cadastrado.';
  } else if(!vetAtivo.mensageriaAtiva){
    situacao = 'Os lembretes estão desligados para o veterinário ativo ("'+esc(vetAtivo.nome)+'"). Ligue a opção ao editá-lo.';
  } else {
    situacao = 'Ativo — enviando para "'+esc(vetAtivo.nome)+'" ('+esc(vetAtivo.email)+').';
  }
  const ultimaChecagem = ultimaVerificacaoLembretes
    ? ultimaVerificacaoLembretes.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
    : 'ainda não rodou';
  el.innerHTML = ''+
    '<div class="card-sub" style="margin-bottom:8px;">'+situacao+'</div>'+
    '<div class="muted" style="font-size:12.5px;">Última verificação: '+ultimaChecagem+' • Lembretes enviados nesta sessão: '+lembretesEnviadosSessao+'</div>'+
    (ultimoErroLembretes ? ('<div style="font-size:12.5px; color:var(--brick); margin-top:4px;">Último erro ao enviar: '+esc(ultimoErroLembretes)+'</div>') : '')+
    '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="verificarLembretesAgora()">Verificar agora</button>';
}
async function driveUpdateFile(fileId, bytes){
  await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media', {
    method:'PATCH',
    headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},
    body: bytes
  });
}

async function driveInitialSync(){
  driveStatus = 'checking';
  autoSaveStatus = 'loading';
  renderAutoSaveIndicator();
  try{
    const existing = await driveFindFile();
    if(existing){
      driveFileId = existing.id;
      const bytes = await driveDownloadFile(existing.id);
      const wb = XLSX.read(bytes, {type:'array'});
      applyWorkbookToState(wb);
      toast('Dados carregados do Google Drive.');
    } else {
      const wb = buildWorkbook();
      const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      driveFileId = await driveCreateFile(arr);
      toast(BACKUP_FILE_NAME+' criado no seu Google Drive.');
    }
    driveStatus = 'ok';
    autoSaveStatus = 'ok';
    lastAutoSaveAt = new Date();
    atualizarInfoArmazenamentoDrive();
  }catch(err){
    console.error('Erro ao sincronizar com o Google Drive:', err);
    driveStatus = 'error';
    autoSaveStatus = 'error';
    toast('Google Drive: '+(err&&err.message?err.message:'falha ao sincronizar')+' — usando outra forma de salvar por enquanto.');
    /* recorre às camadas locais como reserva, para não perder o que já existia */
    loadFromStorage();
  }
  render();
  renderAutoSaveIndicator();
}

/* Consulta quanto de espaço ainda resta na conta Google conectada, para mostrar
   logo abaixo do status de salvamento. Contas do Workspace com armazenamento
   ilimitado não retornam um "limit" — nesse caso mostramos "ilimitado". */
async function atualizarInfoArmazenamentoDrive(){
  if(!auth.signedIn) return;
  try{
    const r = await driveApiFetch('https://www.googleapis.com/drive/v3/about?fields=storageQuota');
    const data = await r.json();
    const quota = (data && data.storageQuota) || {};
    if(quota.limit){
      const limite = Number(quota.limit);
      const uso = Number(quota.usage||0);
      const restantePct = Math.max(0, Math.min(100, 100 - (uso/limite*100)));
      driveStorageInfo = {ilimitado:false, restantePct:restantePct};
    } else {
      driveStorageInfo = {ilimitado:true, restantePct:null};
    }
  }catch(err){
    console.error('Não foi possível obter o espaço livre no Google Drive:', err);
    driveStorageInfo = null;
  }
  renderAutoSaveIndicator();
}

/* ---------- Salvamento automático ---------- */
/* Camada 0 (principal): Google Drive, na conta logada — assim que o login com Google é
   concluído, os dados são lidos/gravados automaticamente no arquivo BDVET.xlsx do Drive.
   Camada 1: window.storage (memória persistente do artifact) — silenciosa, sem intervenção.
   Camada 2: File System Access API — conecta um arquivo BDVET.xlsx local com um clique; só
   entra em ação se o Google Drive não estiver disponível ou falhar.
   Camada 3: nenhuma das anteriores disponível — depende de exportar/importar manualmente.
   Nota: nenhum navegador permite que uma página acesse ou crie arquivos no disco sem
   uma ação explícita da pessoa (é uma proteção de segurança do próprio navegador,
   não uma limitação deste app) — por isso a camada 2 sempre pede 1 clique na primeira vez. */
const BACKUP_FILE_NAME = 'BDVET.xlsx';
let fileHandle = null;

function renderConnectBanner(){
  const el = document.getElementById('connect-banner');
  if(!el) return;
  const usingStorage = !!window.storage;
  const usingDrive = auth.signedIn && !!driveFileId && driveStatus!=='error';
  const fsSupported = !!(window.showOpenFilePicker && window.showSaveFilePicker);
  if(usingDrive || usingStorage || fileHandle || !fsSupported){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'flex';
  el.innerHTML = ''+
    '<div class="txt"><strong>Conectar ao arquivo '+BACKUP_FILE_NAME+'</strong>'+
    '<div>Já tem esse arquivo em algum lugar? Selecione-o para carregar os dados. Ainda não tem? Crie um novo.</div></div>'+
    '<div class="btn-row">'+
      '<button class="btn btn-ghost btn-sm" onclick="openExistingBackupFile()">Já existe — selecionar</button>'+
      '<button class="btn btn-primary btn-sm" onclick="createNewBackupFile()">'+ICONS.save+' Criar novo</button>'+
    '</div>';
}

function renderAutoSaveIndicator(){
  const el = document.getElementById('autosave-indicator');
  if(!el) return;
  let dotClass = 'muted', text = 'Ainda não há alterações salvas.';
  const usingDrive = auth.signedIn && !!driveFileId;
  if(autoSaveStatus==='loading'){
    dotClass='muted'; text='Carregando dados salvos…';
  } else if(autoSaveStatus==='saving'){
    dotClass='warn'; text='Salvando alterações…';
  } else if(autoSaveStatus==='error'){
    dotClass='error'; text = usingDrive ? 'Falha ao salvar no Google Drive agora.' : 'Falha ao salvar automaticamente agora.';
  } else if(autoSaveStatus==='ok' && lastAutoSaveAt){
    dotClass='sage';
    const when = lastAutoSaveAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    text = usingDrive ? ('Salvo no Google Drive às '+when) : (fileHandle ? ('Salvo em "'+fileHandle.name+'" às '+when) : ('Salvo automaticamente às '+when));
  } else if(usingDrive){
    dotClass='muted'; text='Sincronizando com o Google Drive…';
  } else if(window.storage){
    dotClass='muted'; text='Ainda não há alterações salvas.';
  } else if(fileHandle){
    dotClass='muted'; text='Arquivo conectado — aguardando alterações.';
  } else if(window.showSaveFilePicker){
    dotClass='warn'; text='Use os botões acima para conectar ao "'+BACKUP_FILE_NAME+'".';
  } else {
    dotClass='error'; text='Autosave indisponível aqui — use exportar/importar.';
  }
  let storageHTML = '';
  if(usingDrive && driveStorageInfo){
    storageHTML = driveStorageInfo.ilimitado
      ? '<div class="drive-storage">Espaço no Google Drive: ilimitado</div>'
      : '<div class="drive-storage">'+driveStorageInfo.restantePct.toFixed(1).replace('.0','')+'% de espaço livre no Google Drive</div>';
  }
  el.innerHTML = '<div class="autosave-main"><span class="mini-dot '+dotClass+'"></span><span>'+text+'</span></div>'+storageHTML;
}

function scheduleAutoSave(){
  const usingDrive = auth.signedIn && !!driveFileId;
  if(!usingDrive && !window.storage && !fileHandle){ renderAutoSaveIndicator(); return; }
  autoSaveStatus = 'saving';
  renderAutoSaveIndicator();
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(doAutoSave, 700);
}

async function doAutoSave(){
  if(auth.signedIn && driveFileId){
    const jaEstavaComErro = (autoSaveStatus==='error');
    try{
      const wb = buildWorkbook();
      const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      await driveUpdateFile(driveFileId, arr);
      autoSaveStatus = 'ok';
      driveStatus = 'ok';
      lastAutoSaveAt = new Date();
    }catch(err){
      console.error('Erro ao salvar no Google Drive:', err);
      autoSaveStatus = 'error';
      driveStatus = 'error';
      if(!jaEstavaComErro){
        toast('Não foi possível salvar no Google Drive: '+(err&&err.message?err.message:'erro desconhecido'));
      }
    }
    renderAutoSaveIndicator();
    return;
  }
  if(window.storage){
    try{
      const payload = JSON.stringify({
        services: state.services,
        tutors: state.tutors,
        pets: state.pets,
        appointments: state.appointments,
        consultas: state.consultas,
        vacinas: state.vacinas,
        veterinarios: state.veterinarios,
        receitas: state.receitas,
        estabelecimento: estabelecimento,
        veterinarioAtivoId: veterinarioAtivoId,
        ids: ids,
        savedAt: new Date().toISOString()
      });
      const result = await window.storage.set(STORAGE_KEY, payload, false);
      if(result){ autoSaveStatus='ok'; lastAutoSaveAt=new Date(); } else { autoSaveStatus='error'; }
    }catch(err){
      console.error('Erro ao salvar automaticamente:', err);
      autoSaveStatus='error';
    }
    renderAutoSaveIndicator();
    return;
  }
  if(fileHandle){
    await writeToFileHandle();
    return;
  }
  renderAutoSaveIndicator();
}

async function loadFromStorage(){
  if(!window.storage){
    autoSaveStatus = 'idle';
    renderConnectBanner();
    renderAutoSaveIndicator();
    return;
  }
  autoSaveStatus = 'loading';
  renderAutoSaveIndicator();
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      if(Array.isArray(parsed.services) && parsed.services.length) state.services = parsed.services;
      if(Array.isArray(parsed.tutors)){
        state.tutors = parsed.tutors.map(function(t){
          if(t.enderecoRua===undefined && t.endereco!==undefined){
            return Object.assign({}, t, {enderecoRua:t.endereco||'', enderecoNumero:'', enderecoBairro:'', enderecoCidade:'', enderecoUf:'', enderecoCep:''});
          }
          return t;
        });
        state.pets = Array.isArray(parsed.pets) ? parsed.pets : [];
      } else if(Array.isArray(parsed.clients)){
        /* migração de um formato salvo antes de tutores e pets serem separados */
        const migTutors = [];
        const migPets = [];
        const tutorByKey = {};
        let nextTutorId = 1, nextPetId = 1;
        const oldToNewPetId = {};
        parsed.clients.forEach(function(c){
          const key = (c.tutor||'')+'|'+(c.telefone||'');
          let t = tutorByKey[key];
          if(!t){
            t = {id: nextTutorId++, nome:c.tutor||'', telefone:c.telefone||'', cpf:'', enderecoRua:'', enderecoNumero:'', enderecoBairro:'', enderecoCidade:'', enderecoUf:'', enderecoCep:''};
            tutorByKey[key] = t;
            migTutors.push(t);
          }
          const novoPetId = nextPetId++;
          migPets.push({id:novoPetId, tutorId:t.id, nome:c.petNome||'', especie:c.especie||'', peso:0, idade:'', sexo:'', corPelo:'', comprimentoPelo:''});
          oldToNewPetId[c.id] = novoPetId;
        });
        state.tutors = migTutors;
        state.pets = migPets;
        if(Array.isArray(parsed.appointments)){
          parsed.appointments = parsed.appointments.map(function(a){
            return {
              id:a.id, data:a.data, hora:a.hora, status:a.status,
              petId: oldToNewPetId[a.clienteId] || null,
              servicoId:a.servicoId, valor:a.valor, custo:a.custo, obs:a.obs
            };
          });
        }
      }
      if(Array.isArray(parsed.appointments)) state.appointments = parsed.appointments;
      if(Array.isArray(parsed.consultas)) state.consultas = parsed.consultas;
      if(Array.isArray(parsed.vacinas)) state.vacinas = parsed.vacinas;
      if(Array.isArray(parsed.veterinarios)) state.veterinarios = parsed.veterinarios;
      if(Array.isArray(parsed.receitas)) state.receitas = parsed.receitas;
      if(parsed.estabelecimento){
        const defaultEstab = {enderecoRua:'', enderecoNumero:'', enderecoBairro:'', enderecoCidade:'', enderecoUf:'', enderecoCep:'', email:''};
        estabelecimento = Object.assign(defaultEstab, parsed.estabelecimento);
        if(!estabelecimento.enderecoRua && parsed.estabelecimento.endereco){
          estabelecimento.enderecoRua = parsed.estabelecimento.endereco;
        }
      }
      if(parsed.veterinarioAtivoId!==undefined) veterinarioAtivoId = parsed.veterinarioAtivoId;
      if(parsed.ids) ids = Object.assign({service:1,tutor:1,pet:1,appointment:1,consulta:1,vacina:1,veterinario:1,receita:1}, parsed.ids);
      lastAutoSaveAt = parsed.savedAt ? new Date(parsed.savedAt) : null;
      autoSaveStatus = lastAutoSaveAt ? 'ok' : 'idle';
    } else {
      autoSaveStatus = 'idle';
    }
  }catch(err){
    /* Ainda não existe nenhum dado salvo — é normal na primeira vez. */
    autoSaveStatus = 'idle';
  }
  render();
  renderAutoSaveIndicator();
}

/* ---------- Camada 2: conectar o arquivo BDVET.xlsx (Chrome/Edge no computador) ----------
   Importante: usamos showOpenFilePicker para um arquivo EXISTENTE (só pede permissão de
   leitura/escrita, sem prompt de "substituir") e showSaveFilePicker apenas para CRIAR um
   arquivo novo. Usar o picker de salvar para abrir um arquivo já existente é o que causava
   o prompt de sobrescrever em vez de conectar. */
async function openExistingBackupFile(){
  if(!window.showOpenFilePicker){
    toast('Esse navegador não permite selecionar um arquivo diretamente.');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      multiple: false,
      types: [{
        description: 'Planilha Excel',
        accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}
      }]
    });
    fileHandle = handle;
    const carregouDadosExistentes = await loadFromFileHandleIfAny();
    await writeToFileHandle();
    render();
    renderConnectBanner();
    renderAutoSaveIndicator();
    toast(carregouDadosExistentes
      ? ('Conectado a "'+fileHandle.name+'" — dados existentes carregados.')
      : ('Conectado a "'+fileHandle.name+'".'));
  }catch(err){
    if(err && err.name!=='AbortError'){
      console.error(err);
      toast('Não foi possível abrir esse arquivo.');
    }
    renderConnectBanner();
    renderAutoSaveIndicator();
  }
}

async function createNewBackupFile(){
  if(!window.showSaveFilePicker){
    toast('Esse navegador não permite criar um arquivo diretamente.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: BACKUP_FILE_NAME,
      types: [{
        description: 'Planilha Excel',
        accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}
      }]
    });
    fileHandle = handle;
    await writeToFileHandle();
    render();
    renderConnectBanner();
    renderAutoSaveIndicator();
    toast('Arquivo "'+fileHandle.name+'" criado e conectado.');
  }catch(err){
    if(err && err.name!=='AbortError'){
      console.error(err);
      toast('Não foi possível criar o arquivo neste ambiente.');
    }
    renderConnectBanner();
    renderAutoSaveIndicator();
  }
}

function disconnectBackupFile(){
  fileHandle = null;
  autoSaveStatus = 'idle';
  toast('Arquivo desconectado.');
  render();
  renderAutoSaveIndicator();
}

async function loadFromFileHandleIfAny(){
  if(!fileHandle) return false;
  try{
    const file = await fileHandle.getFile();
    if(!file || file.size === 0) return false;
    const buffer = await file.arrayBuffer();
    const data = new Uint8Array(buffer);
    const wb = XLSX.read(data, {type:'array'});
    return applyWorkbookToState(wb);
  }catch(err){
    console.log('Arquivo novo ou vazio — nada para carregar ainda.');
    return false;
  }
}

async function writeToFileHandle(){
  if(!fileHandle) return;
  try{
    autoSaveStatus = 'saving';
    renderAutoSaveIndicator();
    const wb = buildWorkbook();
    const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const writable = await fileHandle.createWritable();
    await writable.write(arr);
    await writable.close();
    autoSaveStatus = 'ok';
    lastAutoSaveAt = new Date();
  }catch(err){
    console.error('Erro ao gravar no arquivo conectado:', err);
    autoSaveStatus = 'error';
  }
  renderAutoSaveIndicator();
}

function render(){
  renderNav();
  renderConnectBanner();
  renderAutoSaveIndicator();
  renderUserChip();
  const c = document.getElementById('content');
  if(currentTab==='painel') c.innerHTML = renderPainel();
  else if(currentTab==='servicos') c.innerHTML = renderServicos();
  else if(currentTab==='clientes') c.innerHTML = renderClientes();
  else if(currentTab==='agendamentos') c.innerHTML = renderAgendamentos();
  else if(currentTab==='consulta') c.innerHTML = renderConsulta();
  else if(currentTab==='vacina') c.innerHTML = renderVacina();
  else if(currentTab==='receita') c.innerHTML = renderReceita();
  else if(currentTab==='prontuarios') c.innerHTML = renderProntuarios();
  else if(currentTab==='relatorios') c.innerHTML = renderRelatorios();
  else if(currentTab==='backup') c.innerHTML = renderBackup();
  else if(currentTab==='configuracoes') c.innerHTML = renderConfiguracoes();

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV_ITEMS.map(function(item){
    const active = item.id===currentTab ? 'active' : '';
    const dot = (item.id==='backup' && dirty) ? '<span class="nav-dot"></span>' : '';
    return '<button class="nav-item '+active+'" onclick="setTab(\''+item.id+'\')">'+item.icon+'<span>'+item.label+'</span>'+dot+'</button>';
  }).join('');
}

/* ---------- PAINEL ---------- */
function renderPainel(){
  const hoje = todayISO();
  const agendaHoje = state.appointments.filter(a=>a.data===hoje).sort((a,b)=>a.hora.localeCompare(b.hora));
  const faturamento = agendaHoje.filter(a=>a.status!=='Cancelado').reduce((s,a)=>s+Number(a.valor||0),0);
  const custoDia = agendaHoje.filter(a=>a.status!=='Cancelado').reduce((s,a)=>s+Number(a.custo||0),0);

  const rows = agendaHoje.length ? agendaHoje.map(function(a){
    const pet = state.pets.find(p=>p.id===a.petId);
    const tutor = pet ? state.tutors.find(t=>t.id===pet.tutorId) : null;
    const serv = state.services.find(s=>s.id===a.servicoId);

  '<div class="page-head">'+
    '<div><span class="eyebrow">Oca Pet</span><h1>Bom dia por aí 🐾</h1><div class="sub">'+formatFullDate(hoje)+'</div></div>'+
    '<button class="btn btn-accent" onclick="setTab(\'agendamentos\'); openAppointmentForm();">'+ICONS.plus+' Novo agendamento</button>'+
  '</div>'+
  '<div class="grid-stats">'+
    '<div class="stat-card"><div class="label">Agendamentos hoje</div><div class="value">'+agendaHoje.length+'</div></div>'+
    '<div class="stat-card"><div class="label">Faturamento previsto hoje</div><div class="value accent">'+formatCurrency(faturamento)+'</div></div>'+
    '<div class="stat-card"><div class="label">Margem prevista hoje</div><div class="value">'+formatCurrency(faturamento-custoDia)+'</div></div>'+
    '<div class="stat-card"><div class="label">Serviços cadastrados</div><div class="value">'+state.services.length+'</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<h2>Agenda de hoje</h2>'+
    '<div class="card-sub">Horários marcados para '+formatDateBR(hoje)+'.</div>'+
    '<div class="table-scroll"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Serviço</th><th>Valor</th><th>Status</th></tr></thead>'+

function setServiceFilter(f){ serviceFilter=f; render(); }
function toggleShowCancelledServices(){ showCancelledServices=!showCancelledServices; render(); }
function statusServiceBadge(status){
  const cls = status==='Cancelado' ? 'badge-cancelado' : 'badge-concluido';
  return '<span class="badge '+cls+'">'+esc(status)+'</span>';
}
function openServiceForm(id){
  editingServiceId = id || null;
  serviceFormVisible = true;
  render();
}
function closeServiceForm(){ serviceFormVisible=false; editingServiceId=null; render(); }
function saveService(e){
  e.preventDefault();
  const f = e.target;
  const nome = f.nome.value.trim();
  const categoria = f.categoria.value;
  const status = f.status.value;
  const valor = parseFloat(f.valor.value)||0;
  const custo = parseFloat(f.custo.value)||0;
  if(!nome) return;
  if(editingServiceId){
    const s = state.services.find(x=>x.id===editingServiceId);
    Object.assign(s,{nome:nome,categoria:categoria,status:status,valor:valor,custo:custo});
  } else {
    state.services.push({id:ids.service++, nome:nome, categoria:categoria, status:status, valor:valor, custo:custo});
  }
  markDirty();
  closeServiceForm();
  toast('Serviço salvo.');
}
function deleteService(id){
  const usedIn = state.appointments.some(a=>a.servicoId===id);
  const msg = usedIn ? 'Esse serviço está usado em agendamentos existentes. Excluir mesmo assim?' : 'Excluir esse serviço?';
  if(!confirm(msg)) return;
  state.services = state.services.filter(s=>s.id!==id);
  markDirty();
  render();
  toast('Serviço excluído.');
}

/* ---------- CLIENTES & PETS ---------- */
function tutorNome(id){
  const t = state.tutors.find(function(x){ return x.id===id; });
  return t ? t.nome : '';
}

function normalizeDigits(str){
  return String(str||'').replace(/\D/g,'');
}

function filterTutorsForSearch(term){
  const t = (term||'').toLowerCase().trim();
  if(!t) return state.tutors;
  const tDigits = normalizeDigits(term);
  return state.tutors.filter(function(tu){
    const nomeMatch = (tu.nome||'').toLowerCase().indexOf(t)!==-1;
    const cpfMatch = tDigits.length>0 && normalizeDigits(tu.cpf).indexOf(tDigits)!==-1;
    const petMatch = state.pets.some(function(p){ return p.tutorId===tu.id && (p.nome||'').toLowerCase().indexOf(t)!==-1; });
    return nomeMatch || cpfMatch || petMatch;
  });
}

    '<div class="form-grid cols-3">'+
      '<div class="field span-2"><label>Nome do pet</label>'+
        '<input name="nome" required placeholder="Ex.: Thor" value="'+esc(editingPet?editingPet.nome:'')+'"></div>'+
      '<div class="field"><label>Peso (kg)</label>'+
        '<input name="peso" type="number" min="0" step="0.1" value="'+(editingPet&&editingPet.peso?editingPet.peso:'')+'"></div>'+
      '<div class="field"><label>Espécie / raça</label>'+

        '</select></div>'+
      '<div class="field"><label>Cor do pelo</label>'+
        '<input name="corPelo" placeholder="Ex.: Caramelo" value="'+esc(editingPet?editingPet.corPelo:'')+'"></div>'+

  '</form>';

  const tutoresFiltrados = filterTutorsForSearch(clientesSearchTerm);

  const tutorCards = tutoresFiltrados.length ? tutoresFiltrados.map(function(t){

    const petRows = pets.length ? pets.map(function(p){
      return '<tr>'+
        '<td>'+petNomeComFoto(p, 39)+'</td>'+
        '<td class="muted">'+esc(p.especie||'—')+'</td>'+
        '<td class="num">'+(p.peso?(p.peso+' kg'):'—')+'</td>'+
        '<td class="muted">'+esc(p.idade||'—')+'</td>'+
        '<td class="muted">'+esc(p.sexo||'—')+'</td>'+
        '<td class="muted">'+esc(p.corPelo||'—')+(p.comprimentoPelo?(' · '+esc(p.comprimentoPelo)):'')+'</td>'+

          '<button class="icon-btn" title="Editar pet" onclick="openPetForm('+t.id+','+p.id+')">'+ICONS.edit+'</button>'+
          '<button class="icon-btn danger" title="Excluir pet" onclick="deletePet('+p.id+')">'+ICONS.trash+'</button>'+
        '</div></td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="7" class="muted" style="padding:14px 0;">Nenhum pet cadastrado para esse responsável ainda.</td></tr>';

    const podeAdicionar = pets.length < MAX_PETS_POR_TUTOR;
    return ''+
    '<div class="card">'+
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">'+
        '<div><h2 style="font-size:17px;">'+esc(t.nome)+'</h2>'+
        '<div class="muted" style="font-size:12.5px; margin-top:3px;">'+
          esc(t.telefone||'sem telefone')+
          (t.cpf?(' • CPF '+esc(t.cpf)):'')+
          (t.email?(' • '+esc(t.email)):'')+
          (formatEndereco(t)?(' • '+esc(formatEndereco(t))):'')+
        '</div></div>'+
        '<div class="cell-actions">'+
          '<button class="icon-btn" title="Editar responsável" onclick="openTutorForm('+t.id+')">'+ICONS.edit+'</button>'+

      '<tbody>'+petRows+'</tbody></table></div>'+

      '</div>'+
    '</div>';
  }).join('') : (state.tutors.length
    ? '<div class="card"><div class="empty">'+ICONS.emptyPaw+'<p>Nenhum responsável ou pet encontrado com esse termo.</p></div></div>'
    : '<div class="card"><div class="empty">'+ICONS.emptyPaw+'<p>Nenhum responsável cadastrado ainda. Cadastre o primeiro responsável da Oca Pet.</p></div></div>');

  const searchHTML = !state.tutors.length ? '' : ''+
  '<div class="card" style="margin-bottom:16px;">'+
    '<div class="field" style="margin:0;">'+
      '<label>Buscar responsável ou pet</label>'+

  return ''+

function openTutorForm(id){
  editingTutorId = id || null;
  tutorFormVisible = true;
  petFormVisible = false;
  render();
}
function closeTutorForm(){ tutorFormVisible=false; editingTutorId=null; render(); }
function saveTutor(e){
  e.preventDefault();
  const f = e.target;
  const nome = f.nome.value.trim();
  const telefone = f.telefone.value.trim();
  const cpf = f.cpf.value.trim();
  const email = f.email.value.trim();
  const enderecoRua = f.rua.value.trim();
  const enderecoNumero = f.numero.value.trim();
  const enderecoBairro = f.bairro.value.trim();
  const enderecoCidade = f.cidade.value.trim();
  const enderecoUf = f.uf.value;
  const enderecoCep = f.cep.value.trim();
  if(!nome) return;
  const dados = {nome:nome,telefone:telefone,cpf:cpf,email:email,enderecoRua:enderecoRua,enderecoNumero:enderecoNumero,enderecoBairro:enderecoBairro,enderecoCidade:enderecoCidade,enderecoUf:enderecoUf,enderecoCep:enderecoCep};
  if(editingTutorId){
    const t = state.tutors.find(x=>x.id===editingTutorId);
    Object.assign(t,dados);
  } else {
    state.tutors.push(Object.assign({id:ids.tutor++},dados));
  }
  markDirty();
  closeTutorForm();
  toast('Responsável salvo.');
}
function deleteTutor(id){
  const petsDoTutor = state.pets.filter(function(p){ return p.tutorId===id; });
  const petIds = petsDoTutor.map(function(p){ return p.id; });
  const usedIn = state.appointments.some(function(a){ return petIds.indexOf(a.petId)!==-1; });
  const msg = usedIn
    ? 'Esse responsável tem pet(s) com agendamentos vinculados. Excluir mesmo assim? Os pets dele também serão removidos.'
    : (petsDoTutor.length ? ('Excluir esse responsável e os '+petsDoTutor.length+' pet(s) cadastrados para ele?') : 'Excluir esse responsável?');
  if(!confirm(msg)) return;
  state.pets = state.pets.filter(function(p){ return p.tutorId!==id; });
  state.tutors = state.tutors.filter(function(t){ return t.id!==id; });
  markDirty();
  render();
  toast('Responsável excluído.');
}

function openPetForm(tutorId, petId){
  const tutor = state.tutors.find(function(t){ return t.id===tutorId; });
  if(!tutor) return;
  if(!petId){
    const count = state.pets.filter(function(p){ return p.tutorId===tutorId; }).length;
    if(count>=MAX_PETS_POR_TUTOR){ toast('Esse responsável já tem '+MAX_PETS_POR_TUTOR+' pets cadastrados — esse é o limite.'); return; }
  }
  petFormTutorId = tutorId;
  editingPetId = petId || null;
  const editingPetAgora = petId ? state.pets.find(function(p){ return p.id===petId; }) : null;
  petFotoPendente = editingPetAgora ? (editingPetAgora.fotoDataUrl||null) : null;
  petFormVisible = true;
  tutorFormVisible = false;
  render();
}
function closePetForm(){ petFormVisible=false; editingPetId=null; petFormTutorId=null; petFotoPendente=null; render(); }
function savePet(e){
  e.preventDefault();
  const f = e.target;
  const nome = f.nome.value.trim();
  const peso = parseFloat(f.peso.value)||0;
  const especie = f.especie.value.trim();
  const idade = f.idade.value.trim();
  const sexo = f.sexo.value;
  const corPelo = f.corPelo.value.trim();
  const comprimentoPelo = f.comprimentoPelo.value;
  const tutorId = Number(f.tutorId.value);
  const fotoDataUrl = petFotoPendente;
  if(!nome || !tutorId) return;
  let petSalvo;
  if(editingPetId){
    const p = state.pets.find(x=>x.id===editingPetId);
    Object.assign(p,{nome:nome,peso:peso,especie:especie,idade:idade,sexo:sexo,corPelo:corPelo,comprimentoPelo:comprimentoPelo});
    if(fotoDataUrl) p.fotoDataUrl = fotoDataUrl;
    petSalvo = p;
  } else {
    const count = state.pets.filter(function(p){ return p.tutorId===tutorId; }).length;
    if(count>=MAX_PETS_POR_TUTOR){ toast('Esse responsável já tem '+MAX_PETS_POR_TUTOR+' pets cadastrados — esse é o limite.'); return; }
    const novo = {id:ids.pet++, tutorId:tutorId, nome:nome, peso:peso, especie:especie, idade:idade, sexo:sexo, corPelo:corPelo, comprimentoPelo:comprimentoPelo, fotoDataUrl: fotoDataUrl||null};
    state.pets.push(novo);
    petSalvo = novo;
  }
  markDirty();
  if(fotoDataUrl) uploadFotoPetParaDrive(petSalvo, fotoDataUrl);
  petFotoPendente = null;
  closePetForm();
  toast('Pet salvo.');
}
function deletePet(id){
  const usedIn = state.appointments.some(function(a){ return a.petId===id; });
  const msg = usedIn ? 'Esse pet tem agendamentos vinculados. Excluir mesmo assim?' : 'Excluir esse pet?';
  if(!confirm(msg)) return;
  state.pets = state.pets.filter(function(p){ return p.id!==id; });
  markDirty();
  render();
  toast('Pet excluído.');
}

/* ---------- AGENDAMENTOS ---------- */
function renderAgendamentos(){
  const editing = editingAppointmentId ? state.appointments.find(a=>a.id===editingAppointmentId) : null;
  const activeServices = state.services.filter(function(s){ return (s.status||'Ativo')==='Ativo'; });

  if(!state.pets.length || !activeServices.length){
    appointmentFormVisible = false;
  }

  const petOptions = state.pets.map(function(p){
    const sel = editing && editing.petId===p.id ? 'selected' : '';
    const t = state.tutors.find(function(x){ return x.id===p.tutorId; });
    return '<option value="'+p.id+'" '+sel+'>'+esc(p.nome)+' — '+esc(t?t.nome:'sem responsável')+'</option>';
  }).join('');
  const serviceOptions = state.services.filter(function(s){
    return (s.status||'Ativo')==='Ativo' || (editing && editing.servicoId===s.id);
  }).map(function(s){
    const sel = editing && editing.servicoId===s.id ? 'selected' : '';
    const cancelledTag = (s.status==='Cancelado') ? ' (cancelado)' : '';
    return '<option value="'+s.id+'" data-valor="'+s.valor+'" data-custo="'+s.custo+'" '+sel+'>'+esc(s.nome)+cancelledTag+' ('+esc(s.categoria)+')</option>';
  }).join('');

  const blockedMsg = (!state.pets.length || !activeServices.length) ? ''+
    '<div class="form-panel" style="border-style:solid;">'+
      '<h2>Antes de agendar…</h2>'+
      '<p class="muted" style="margin:0 0 12px 0; font-size:13.5px;">Para marcar um horário, cadastre pelo menos um serviço ativo e um paciente.</p>'+
      '<div class="form-actions" style="margin-top:0;">'+
        (!activeServices.length?'<button class="btn btn-ghost" onclick="setTab(\'servicos\')">Cadastrar serviço</button>':'')+
        (!state.pets.length?'<button class="btn btn-ghost" onclick="setTab(\'clientes\')">Cadastrar paciente</button>':'')+
      '</div>'+
    '</div>' : '';

  const formHTML = !appointmentFormVisible ? '' : ''+
  '<form class="form-panel" onsubmit="saveAppointment(event)">'+
    '<h2>'+(editing?'Editar agendamento':'Novo agendamento')+'</h2>'+
    '<div class="form-grid cols-3">'+
      '<div class="field"><label>Data</label>'+
        '<input name="data" type="date" required value="'+(editing?editing.data:agendaFilterDate)+'"></div>'+
      '<div class="field"><label>Hora</label>'+
        '<input name="hora" type="time" required value="'+(editing?editing.hora:'')+'"></div>'+
      '<div class="field"><label>Status</label>'+
        '<select name="status">'+
          ['Agendado','Concluído','Cancelado'].map(function(st){
            return '<option '+((editing?editing.status:'Agendado')===st?'selected':'')+'>'+st+'</option>';
          }).join('')+
        '</select></div>'+
      '<div class="field span-2"><label>Paciente</label>'+
        '<select name="petId" required onchange="markDirty()">'+petOptions+'</select></div>'+
      '<div class="field"><label>Serviço</label>'+
        '<select name="servicoId" required onchange="onServicoChange(this)">'+serviceOptions+'</select></div>'+
      '<div class="field"><label>Valor (R$)</label>'+
        '<input name="valor" type="number" min="0" step="0.01" required value="'+(editing?editing.valor:'')+'"></div>'+
      '<div class="field"><label>Custo (R$)</label>'+
        '<input name="custo" type="number" min="0" step="0.01" required value="'+(editing?editing.custo:'')+'"></div>'+
      '<div></div>'+
      '<div class="field span-2" style="grid-column:1 / -1;"><label>Observações</label>'+
        '<textarea name="obs" placeholder="Ex.: pet agitado, trazer coleira de focinho...">'+esc(editing?editing.obs:'')+'</textarea></div>'+
    '</div>'+
    '<div class="form-actions">'+
      '<button type="submit" class="btn btn-primary">'+ICONS.check+' Salvar agendamento</button>'+
      '<button type="button" class="btn btn-ghost" onclick="closeAppointmentForm()">Cancelar</button>'+
    '</div>'+
  '</form>';

  const filtered = state.appointments
    .filter(a=> agendaShowAll || a.data===agendaFilterDate)
    .sort((a,b)=> (a.data+a.hora).localeCompare(b.data+b.hora));

  const rows = filtered.length ? filtered.map(function(a){
    const pet = state.pets.find(p=>p.id===a.petId);
    const tutor = pet ? state.tutors.find(t=>t.id===pet.tutorId) : null;
    const serv = state.services.find(s=>s.id===a.servicoId);
    return '<tr>'+
      (agendaShowAll ? '<td class="num muted">'+formatDateBR(a.data)+'</td>' : '')+
      '<td class="num">'+esc(a.hora)+'</td>'+
      '<td><span style="display:inline-flex; align-items:center; gap:6px;">'+petAvatar(pet,30)+'<span>'+esc(pet?pet.nome:'—')+'</span></span> <span class="muted">('+esc(tutor?tutor.nome:'—')+')</span></td>'+
      '<td>'+esc(serv?serv.nome:'—')+'</td>'+
      '<td class="num">'+formatCurrency(a.valor)+'</td>'+
      '<td>'+statusBadge(a.status)+'</td>'+
      '<td><div class="cell-actions">'+
        (a.status!=='Concluído' ? '<button class="icon-btn" title="Marcar como concluído" onclick="quickComplete('+a.id+')">'+ICONS.check+'</button>' : '')+
        '<button class="icon-btn" title="Editar" onclick="openAppointmentForm('+a.id+')">'+ICONS.edit+'</button>'+
        '<button class="icon-btn danger" title="Excluir" onclick="deleteAppointment('+a.id+')">'+ICONS.trash+'</button>'+
      '</div></td>'+
    '</tr>';
  }).join('') : '<tr><td colspan="'+(agendaShowAll?7:6)+'"><div class="empty">'+ICONS.emptyPaw+'<p>Nenhum agendamento '+(agendaShowAll?'cadastrado ainda.':'para essa data.')+'</p></div></td></tr>';

  return ''+
  '<div class="page-head">'+
    '<div><span class="eyebrow">Agenda</span><h1>Agendamentos</h1><div class="sub">Horários dos pacientes, com valores e custos de cada serviço.</div></div>'+
    ((appointmentFormVisible || !state.pets.length || !activeServices.length)?'':'<button class="btn btn-accent" onclick="openAppointmentForm()">'+ICONS.plus+' Novo agendamento</button>')+
  '</div>'+
  blockedMsg+
  formHTML+
  '<div class="pill-row" style="align-items:center;">'+
    '<input type="date" value="'+agendaFilterDate+'" onchange="setAgendaDate(this.value)" style="border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--ink-soft); background:#fff;" '+(agendaShowAll?'disabled':'')+'>'+
    '<button class="pill '+(agendaShowAll?'active':'')+'" onclick="toggleAgendaAll()">Todos os dias</button>'+
  '</div>'+
  '<div class="card" style="padding:0;">'+
    '<div class="table-scroll"><table><thead><tr>'+
      (agendaShowAll?'<th>Data</th>':'')+
      '<th>Hora</th><th>Paciente</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
  '</div>';
}
function setAgendaDate(v){ agendaFilterDate = v; render(); }
function toggleAgendaAll(){ agendaShowAll = !agendaShowAll; render(); }
function onServicoChange(sel){
  const opt = sel.options[sel.selectedIndex];
  const form = sel.closest('form');
  form.valor.value = opt.getAttribute('data-valor');
  form.custo.value = opt.getAttribute('data-custo');
}
function openAppointmentForm(id){
  const hasActiveService = state.services.some(function(s){ return (s.status||'Ativo')==='Ativo'; });
  if(!state.pets.length || !hasActiveService){ toast('Cadastre um serviço ativo e um paciente primeiro.'); return; }
  editingAppointmentId = id || null;
  appointmentFormVisible = true;
  render();
}
function closeAppointmentForm(){ appointmentFormVisible=false; editingAppointmentId=null; render(); }
function saveAppointment(e){
  e.preventDefault();
  const f = e.target;
  const data = f.data.value;
  const hora = f.hora.value;
  const status = f.status.value;
  const petId = Number(f.petId.value);
  const servicoId = Number(f.servicoId.value);
  const valor = parseFloat(f.valor.value)||0;
  const custo = parseFloat(f.custo.value)||0;
  const obs = f.obs.value.trim();
  if(!data || !hora || !petId || !servicoId) return;
  if(editingAppointmentId){
    const a = state.appointments.find(x=>x.id===editingAppointmentId);
    const mudouHorario = a.data!==data || a.hora!==hora;
    Object.assign(a,{data:data,hora:hora,status:status,petId:petId,servicoId:servicoId,valor:valor,custo:custo,obs:obs});
    if(mudouHorario) a.lembreteEnviado = false;
  } else {
    state.appointments.push({id:ids.appointment++, data:data, hora:hora, status:status, petId:petId, servicoId:servicoId, valor:valor, custo:custo, obs:obs, lembreteEnviado:false});
  }
  markDirty();
  closeAppointmentForm();
  toast('Agendamento salvo.');
}
function quickComplete(id){
  const a = state.appointments.find(x=>x.id===id);
  if(!a) return;
  a.status = 'Concluído';
  markDirty();
  render();
  toast('Agendamento marcado como concluído.');
}
function deleteAppointment(id){
  if(!confirm('Excluir esse agendamento?')) return;
  state.appointments = state.appointments.filter(a=>a.id!==id);
  markDirty();
  render();
  toast('Agendamento excluído.');
}

/* ---------- PAINEL MENSAL (relatório consolidado) ---------- */
function computeMonthlyReport(){
  const map = {};
  state.appointments.forEach(function(a){
    if(a.status==='Cancelado') return;
    if(!a.data) return;
    const key = a.data.slice(0,7);
    if(!map[key]) map[key] = {};
    const serv = state.services.find(function(s){ return s.id===a.servicoId; });
    const cat = serv ? serv.categoria : 'Outros';
    if(!map[key][cat]) map[key][cat] = {qtd:0, valor:0, custo:0};
    map[key][cat].qtd += 1;
    map[key][cat].valor += Number(a.valor||0);
    map[key][cat].custo += Number(a.custo||0);
  });
  return map;
}
function monthLabel(key){
  const parts = key.split('-');
  const y = Number(parts[0]), m = Number(parts[1]);
  const nome = MESES[m-1] || '';
  return nome.charAt(0).toUpperCase()+nome.slice(1)+' de '+y;
}
function renderRelatorios(){
  const map = computeMonthlyReport();
  const months = Object.keys(map).sort().reverse();

  const totalGeral = {qtd:0, valor:0, custo:0};
  months.forEach(function(k){
    Object.keys(map[k]).forEach(function(cat){
      const v = map[k][cat];
      totalGeral.qtd += v.qtd; totalGeral.valor += v.valor; totalGeral.custo += v.custo;
    });
  });

  const liquidaPorMes = months.map(function(k){
    const cats = Object.keys(map[k]).map(function(cat){ return map[k][cat]; });
    const valor = cats.reduce(function(s,v){ return s+v.valor; },0);
    const custo = cats.reduce(function(s,v){ return s+v.custo; },0);
    return valor-custo;
  });
  const maxLiquida = Math.max(1, ...liquidaPorMes.map(function(v){ return Math.max(v,0); }));

  const monthCards = months.length ? months.map(function(k){
    const cats = map[k];
    const catKeys = Object.keys(cats);
    const catRows = catKeys.map(function(cat){
      const v = cats[cat];
      const liquida = v.valor - v.custo;
      return '<tr><td>'+catBadge(cat)+'</td><td class="num">'+v.qtd+'</td><td class="num">'+formatCurrency(v.valor)+'</td><td class="num muted">'+formatCurrency(v.custo)+'</td><td class="num">'+formatCurrency(liquida)+'</td></tr>';
    }).join('');
    const qtdTotal = catKeys.reduce(function(s,cat){ return s+cats[cat].qtd; },0);
    const valorTotal = catKeys.reduce(function(s,cat){ return s+cats[cat].valor; },0);
    const custoTotal = catKeys.reduce(function(s,cat){ return s+cats[cat].custo; },0);
    const liquidaTotal = valorTotal-custoTotal;
    const barPct = Math.max(4, Math.round((Math.max(liquidaTotal,0)/maxLiquida)*100));
    return ''+
    '<div class="card">'+
      '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;">'+
        '<h2>'+monthLabel(k)+'</h2>'+
        '<div class="muted" style="font-size:13px;">'+qtdTotal+' serviço(s) realizados</div>'+
      '</div>'+
      '<div class="month-bar-track"><div class="month-bar-fill" style="width:'+barPct+'%;"></div></div>'+
      '<div class="table-scroll" style="margin-top:16px;"><table><thead><tr><th>Categoria</th><th>Qtd.</th><th>Valor total</th><th>Custo total</th><th>Receita líquida</th></tr></thead>'+
      '<tbody>'+catRows+
      '<tr style="font-weight:700;"><td>Total do mês</td><td class="num">'+qtdTotal+'</td><td class="num">'+formatCurrency(valorTotal)+'</td><td class="num muted">'+formatCurrency(custoTotal)+'</td><td class="num">'+formatCurrency(liquidaTotal)+'</td></tr>'+
      '</tbody></table></div>'+
    '</div>';
  }).join('') : '<div class="card"><div class="empty">'+ICONS.emptyPaw+'<p>Ainda não há agendamentos suficientes para gerar um relatório mensal.</p></div></div>';

  return ''+
  '<div class="page-head">'+
    '<div><span class="eyebrow">Financeiro</span><h1>Painel Mensal</h1><div class="sub">Quantidade de serviços por tipo, valores totais e receita líquida, mês a mês.</div></div>'+
  '</div>'+
  '<div class="grid-stats">'+
    '<div class="stat-card"><div class="label">Serviços no período</div><div class="value">'+totalGeral.qtd+'</div></div>'+
    '<div class="stat-card"><div class="label">Receita bruta total</div><div class="value accent">'+formatCurrency(totalGeral.valor)+'</div></div>'+
    '<div class="stat-card"><div class="label">Custo total</div><div class="value">'+formatCurrency(totalGeral.custo)+'</div></div>'+
    '<div class="stat-card"><div class="label">Receita líquida total</div><div class="value">'+formatCurrency(totalGeral.valor-totalGeral.custo)+'</div></div>'+
  '</div>'+
  monthCards;
}

function filterPetsBySearch(term){
  const t = (term||'').toLowerCase().trim();
  if(!t) return state.pets;
  return state.pets.filter(function(p){
    const tutor = state.tutors.find(function(x){ return x.id===p.tutorId; });
    const nomePet = (p.nome||'').toLowerCase();
    const nomeTutor = tutor ? (tutor.nome||'').toLowerCase() : '';
    return nomePet.indexOf(t)!==-1 || nomeTutor.indexOf(t)!==-1;
  });
}
function renderPetPickList(results){
